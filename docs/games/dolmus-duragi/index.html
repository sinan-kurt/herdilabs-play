<style>
/* Layout: tam ekran izometrik dünya; üstte hap şeklinde HUD, solda yüzen krem paneller, altta ikonlu dock. Tek görsel dünya, tema bağımsız. */
:root{
  --cream:#fff8ec; --cream-a:rgba(255,248,236,.95); --line:#e6d6bb; --ink:#3b3226; --muted:#8b7b66;
  --coral:#e2694f; --orange:#e8813a; --mint:#4fb08f; --mint-soft:#dff2e8; --mustard:#e2a62a; --bad:#d64545; --good:#3f9b5f;
  --grass:#a3d47c;
  --shadow:0 10px 30px rgba(60,40,20,.18),0 2px 6px rgba(60,40,20,.12);
  --display:"DynaPuff","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:#2a2e31;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
#game{position:relative;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
canvas.panning{cursor:grabbing}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.topbar{position:absolute;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none;font-variant-numeric:tabular-nums}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;background:var(--coral);color:#fff;border-radius:999px;padding:7px 16px;font-family:var(--display);font-weight:700;font-size:16px;box-shadow:var(--shadow);letter-spacing:.01em}
.pill{display:flex;align-items:center;gap:6px;background:var(--cream);border:1.6px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
.pill .i{color:var(--orange)}
#hTrainPill .i{color:#2fa39a}
#hTrainPill.hot{background:#2fa39a;color:#fff;border-color:#2fa39a}
#hTrainPill.hot .i{color:#f2c230}
.stars{color:var(--mustard);letter-spacing:1px;font-size:14px}
.stars .off{color:#e2d5c0}
.tag{font-size:11px;font-weight:900;border-radius:999px;padding:2px 7px;background:var(--mint-soft);color:var(--good)}
.tag.closed{background:#fbe1dc;color:var(--bad)}
.speed{display:flex;gap:2px;background:var(--cream);border:1.6px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.speed button{font:inherit;font-weight:900;font-size:12px;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:4px 10px;display:flex;align-items:center;gap:3px;cursor:pointer}
.speed button.on{background:#fde6cf;color:var(--orange)}
.clockbar{width:54px;height:6px;border-radius:9px;background:#efe3cf;overflow:hidden}
.clockbar i{display:block;height:100%;background:var(--orange);width:0}

.side{position:absolute;left:12px;top:64px;width:270px;display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 160px);overflow:auto;padding-bottom:4px}
.panel{background:var(--cream-a);border:1.6px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow)}
.panel h3{display:flex;align-items:center;gap:7px;margin:0 0 6px;font-size:15px;font-weight:900}
.panel h3 .i{color:var(--coral)}
.badge{margin-left:auto;min-width:20px;height:20px;border-radius:999px;background:var(--coral);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 6px}
.badge.zero{background:#e8dcc7;color:var(--muted)}
.idle{font-size:13px;color:var(--muted);font-style:italic;margin:2px 4px 4px}
.list{display:flex;flex-direction:column;gap:5px}
.task{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:#fff;border:1.4px solid var(--line);border-radius:11px;padding:7px 9px;cursor:pointer}
.task:hover{border-color:var(--orange)}
.task .i{color:var(--muted)}
.task.urgent{border-color:#f0b4a7;background:#fff4f1}
.task.urgent .i{color:var(--bad)}
.task span{min-width:0;flex:1}
.q{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:3px 2px}
.q .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:none}
.q .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .bar{width:60px;height:6px;border-radius:9px;background:#efe3cf;overflow:hidden;flex:none}
.q .bar i{display:block;height:100%}
.carry{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}
.rolls{display:flex;gap:3px;margin-left:auto}
.rolls i{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.rolls i.e{border-color:#d9cbb2;background:transparent}

.dock{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;background:rgba(255,248,236,.96);border:1.6px solid var(--line);border-radius:22px;padding:6px;box-shadow:var(--shadow);max-width:calc(100% - 24px);overflow-x:auto}
.dock button{font:inherit;font-size:12px;font-weight:800;color:var(--ink);background:transparent;border:0;border-radius:16px;padding:6px 10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:58px}
.dock button .i{width:20px;height:20px;color:var(--coral)}
.dock button:hover,.dock button.on{background:#fde9d6}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}

.modal-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(59,50,38,.28)}
.modal{background:var(--cream);border:1.6px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(60,40,20,.3);width:min(720px,100%);max-height:100%;overflow:auto;padding:20px 22px;position:relative;box-sizing:border-box}
.modal h2{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:24px;margin:0;padding-right:36px;text-wrap:balance}
.modal h2 .i{width:24px;height:24px;color:var(--coral)}
.modal .sub{color:var(--muted);font-size:14px;margin:4px 0 14px}
.x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:1.6px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.box{background:#fff;border:1.6px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.box h4{display:flex;align-items:center;gap:7px;margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--coral)}
.box ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.box li{display:flex;gap:9px;font-size:13.5px;line-height:1.45}
.box li .i{margin-top:2px;color:var(--orange)}
.tip{display:flex;gap:8px;align-items:center;background:#fdf1dc;border-radius:12px;padding:9px 12px;font-size:13px;margin-top:12px}
.tip .i{color:var(--mustard)}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.cta{font:inherit;font-weight:900;font-size:15px;color:#fff;background:var(--coral);border:0;border-radius:12px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 12px rgba(226,105,79,.35);display:flex;align-items:center;gap:7px}
.ghost{font:inherit;font-weight:800;font-size:14px;color:var(--ink);background:#fff;border:1.6px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px;margin-bottom:14px;font-variant-numeric:tabular-nums}
.stat{background:#fff;border:1.6px solid var(--line);border-radius:14px;padding:9px 12px}
.stat span{display:block;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-size:22px}
.ups{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.up{background:#fff;border:1.6px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:3px}
.up strong{font-size:15px;font-weight:900}
.up small{color:var(--muted);font-size:12.5px;line-height:1.4;flex:1}
.lv{display:flex;gap:3px;margin:3px 0}
.lv i{flex:1;height:5px;border-radius:9px;background:#efe3cf}
.lv i.on{background:var(--mint)}
.up button{font:inherit;font-weight:900;font-size:13px;margin-top:6px;background:var(--mustard);color:var(--ink);border:0;border-radius:9px;padding:7px;cursor:pointer}
.up button:disabled{background:#efe7da;color:var(--muted);cursor:not-allowed}
.codex{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.ct{display:flex;gap:10px;background:#fff;border:1.6px solid var(--line);border-radius:14px;padding:10px 12px}
.ct .dot{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);flex:none}
.ct div{min-width:0}
.ct strong{font-size:14px;font-weight:900}
.ct p{margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.4}
.ct.locked{opacity:.55}
.modal>.actions:last-child{position:sticky;bottom:-20px;margin:14px -22px -20px;padding:12px 22px;background:var(--cream);border-top:1.6px solid var(--line)}
.newb{display:flex;gap:12px;align-items:center;background:#fdf1dc;border:1.6px dashed #e8c98f;border-radius:14px;padding:10px 12px;margin-top:10px}
.newb .dot{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);flex:none}

#toast{position:absolute;left:50%;top:116px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);background:#1f6f68;color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:800;box-shadow:var(--shadow);transition:opacity .35s, transform .35s;pointer-events:none;z-index:2}
#toast .i{color:#f2c230;width:18px;height:18px}
#toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast.out{opacity:0;transform:translate(-50%,-8px)}
@media (max-width:760px){#toast{top:150px;font-size:12.5px}}
.nexttask{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);font:inherit;font-size:14px;font-weight:900;color:var(--ink);background:#fff;border:1.6px solid var(--line);border-radius:999px;padding:9px 16px 9px 12px;box-shadow:var(--shadow);cursor:pointer;white-space:nowrap}
.nexttask span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.nexttask small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:900}
.nexttask .i{width:18px;height:18px;color:var(--coral)}
.nexttask.urgent{background:#fff4f1;border-color:#f0b4a7}
.nexttask.urgent .i{color:var(--bad)}
.nexttask.calm .i{color:var(--good)}
@media (max-width:760px){
  .side{width:min(240px,calc(100% - 24px));top:auto;bottom:96px;max-height:42%}
  .brand span{display:none}
  .pill{padding:5px 10px;font-size:13px}
  .clockbar{display:none}
  .dock button{min-width:50px;padding:5px 7px 3px;font-size:11px}
}
/* juice */
.modal-wrap:not([hidden]){animation:mwIn .28s ease-out both}
.modal-wrap:not([hidden]) .modal{animation:mIn .42s cubic-bezier(.2,1.4,.4,1) both}
@keyframes mwIn{from{background:rgba(59,50,38,0)}}
@keyframes mIn{from{opacity:0;transform:translateY(26px) scale(.9)}}
.pill.bump{animation:bump .38s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{40%{transform:scale(1.18);background:#fff3c4}}
.stat b.pop{animation:bump .4s cubic-bezier(.2,1.6,.4,1);display:inline-block}
@media (prefers-reduced-motion:reduce){.modal-wrap:not([hidden]),.modal-wrap:not([hidden]) .modal,.pill.bump,.stat b.pop{animation:none}}

.tuthint{position:absolute;left:50%;top:64px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);background:#fff8ec;border:2px solid #f2c230;border-radius:14px;padding:8px 14px;font-size:14px;font-weight:700;box-shadow:var(--shadow);pointer-events:none;z-index:1}
.tuthint .i{width:18px;height:18px;color:var(--coral);flex:none}
.tuthint small{font-weight:900;color:var(--muted);margin-right:2px}
@media (max-width:760px){.tuthint{top:124px;font-size:12.5px;padding:6px 12px;white-space:nowrap;max-width:calc(100% - 20px)}.tuthint span{overflow:hidden;text-overflow:ellipsis;min-width:0}}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{position:relative;background:#fff;border:1.6px solid var(--line);border-radius:14px;padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.step>b{position:absolute;top:-9px;left:-6px;width:22px;height:22px;border-radius:50%;background:var(--coral);color:#fff;font-size:12px;display:grid;place-items:center}
.step .i{width:26px;height:26px;color:var(--coral)}
.step strong{font-size:14px;font-weight:900}
.step small{font-size:12px;color:var(--muted);line-height:1.35}

body{background:#7cc6d9}
:root{--coral:#d98b12;--orange:#e2a62a}
.brand{background:#d98b12}
#toast{position:absolute;left:50%;top:116px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);background:#1f5f8a;color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:800;box-shadow:var(--shadow);transition:opacity .35s, transform .35s;pointer-events:none;z-index:2}
#toast .i{color:#f2c230;width:18px;height:18px}
#toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast.out{opacity:0;transform:translate(-50%,-8px)}
#hWavePill .i{color:#1f5f8a}
#hWavePill.hot{background:#1f5f8a;color:#fff;border-color:#1f5f8a}
#hWavePill.hot .i{color:#f2c230}
.line{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;padding:4px 2px}
@media (max-width:760px){
  .side{left:8px;right:8px;width:auto;bottom:92px;max-height:none;overflow:visible;display:grid;grid-template-columns:1.25fr 1fr;gap:6px;align-items:start}
  .side .panel{padding:6px 8px;border-radius:12px}
  .side .panel h3{margin:0 0 3px;font-size:13px}
  .line{font-size:12px;gap:5px;padding:2px 0}
  .side .q{font-size:12px;padding:1px 0}
  .side .idle{font-size:12px;margin:2px 0}
}
.line .sw{flex:none;width:12px;height:12px;border-radius:4px}
.line .nm{flex:1;min-width:0}
.line .seats{font-variant-numeric:tabular-nums;color:var(--muted)}
.line button{font:inherit;font-weight:900;font-size:12px;border:0;border-radius:9px;padding:5px 10px;background:var(--mustard);color:var(--ink);cursor:pointer}
.line button:disabled{background:#efe7da;color:var(--muted);cursor:not-allowed}
@media (max-width:760px){#toast{top:150px;font-size:12.5px}}
</style>

</head>

<div id="game">

<script>
(() => {
"use strict";
const SAVE_KEY = "dolmusduragi_v1";
const defaultSave = () => ({day:1, money:0, best:0, up:{hat:0, minibus:0, sofor:0, simit:0}});
const C = { ink:"#3b3226", skin:"#f6caa4", good:"#3f9b5f", bad:"#d64545", mustard:"#e2a62a", plum:"#7b4fa0", coral:"#d98b12", yellow:"#f2c230" };
const MUSIC = { bpm:116, lead:"square", leadVol:.04, legato:1.1, chord:"triangle",
  prog:[[73.42,[293.66,369.99,440]],[61.74,[246.94,293.66,369.99]],[49,[196,246.94,293.66]],[55,[220,277.18,329.63]]],
  mel:[
    [[587.33,0,739.99,0,880,739.99,587.33,0],[493.88,0,587.33,739.99,0,587.33,493.88,0],[392,0,493.88,587.33,739.99,0,659.25,0],[554.37,0,659.25,0,739.99,659.25,554.37,0]],
    [[880,0,880,739.99,880,0,987.77,0],[739.99,0,587.33,0,739.99,659.25,587.33,0],[659.25,0,587.33,493.88,587.33,0,392,0],[440,554.37,659.25,739.99,880,0,0,0]],
  ]};
const UPGRADES = [
  {id:"hat", name:"Yeni hat", desc:"Durağa Beşiktaş hattı ve üçüncü dolmuş cebi eklenir.", costs:[90]},
  {id:"minibus", name:"Minibüs", desc:"Dolmuşlar 12 yerine 15 kişilik olur.", costs:[120]},
  {id:"sofor", name:"Sabrı bol şoför", desc:"Şoför kalkmadan önce %30 daha uzun bekler.", costs:[40,90]},
  {id:"simit", name:"Simitçi tezgahı", desc:"Sıradakilerin sabrı %25 daha uzun.", costs:[60]},
];
// ---------- audio: sfx + scheduled background music (each game passes its own MUSIC) ----------
let actx = null, soundOn = true, musicOn = true;
try{ musicOn = localStorage.getItem(SAVE_KEY+"_music") !== "0"; }catch(e){}
function audio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==="suspended") actx.resume(); if(actx && soundOn && musicOn && !document.hidden) startMusic(); }
let mGain = null, mTimer = null, mNext = 0, mStep = 0, hatBuf = null;
function mNote(f, t, dur, type, vol){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.008); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(mGain); o.start(t); o.stop(t+dur+.02);
}
function mStepPlay(i, t){
  const M = MUSIC, B = 60/M.bpm/2, bars = M.prog.length, bar = Math.floor(i/8)%bars, st = i%8, sec = Math.floor(i/(8*bars))%M.mel.length, [root, triad] = M.prog[bar];
  if(st===0 || st===4) mNote(root*(st===4?1.5:1), t, B*1.8, "triangle", .22);
  if(st===2 || st===6) triad.forEach(f => mNote(f, t, B*.8, M.chord||"triangle", .035));
  const m = M.mel[sec][bar][st]; if(m) mNote(m, t, B*(M.legato||1.4), M.lead||"sine", M.leadVol||.07);
  if(st%2===1 && M.hat!==false){ const s = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
    s.buffer = hatBuf; f.type="highpass"; f.frequency.value = 6000; g.gain.value = .05; s.connect(f).connect(g).connect(mGain); s.start(t); }
}
function startMusic(){
  if(mTimer || !actx) return;
  if(!hatBuf){ const n = Math.floor(actx.sampleRate*.03); hatBuf = actx.createBuffer(1, n, actx.sampleRate); const d = hatBuf.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n); }
  mGain = actx.createGain(); mGain.gain.setValueAtTime(0, actx.currentTime); mGain.gain.linearRampToValueAtTime(.45, actx.currentTime+1.2); mGain.connect(actx.destination);
  mNext = actx.currentTime + .08; mStep = 0;
  mTimer = setInterval(() => { const B = 60/(MUSIC.bpm*(1 + .12*(typeof J!=="undefined" ? J.tension : 0)))/2; while(mNext < actx.currentTime + .15){ mStepPlay(mStep, mNext); mNext += B; mStep++; } }, 30);
}
function stopMusic(){
  if(!mTimer) return; clearInterval(mTimer); mTimer = null;
  const g = mGain; g.gain.setTargetAtTime(0, actx.currentTime, .08); setTimeout(() => { try{ g.disconnect(); }catch(e){} }, 600);
}
function tone(freq, dur=.12, type="sine", vol=.12, slide=0, delay=0){
  if(!soundOn||!actx) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur=.08, vol=.06, hp=1800){
  if(!soundOn||!actx) return;
  const len = Math.floor(actx.sampleRate*dur), b = actx.createBuffer(1,len,actx.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer=b; f.type="highpass"; f.frequency.value=hp; g.gain.value=vol; s.connect(f).connect(g).connect(actx.destination); s.start();
}

// ---------- shared shell: helpers, 2D camera, input, modals, toast, loop ----------
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const reduceMotion = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const ic = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const dist = (a,b,c,d) => Math.hypot(a-c, b-d);
const lerp = (a,b,t) => a + (b-a)*t;
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
const P = (x,y,z=0) => [x, y - z];
function shadow(x,y,rx=14,ry=7){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry*.7, 0, 0, 6.3); ctx.fillStyle="rgba(60,40,20,.16)"; ctx.fill(); }

let save = defaultSave();
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)||"null"); if(s && s.up) save = Object.assign(defaultSave(), s, {up:Object.assign(defaultSave().up, s.up)}); } catch(e){}
const persist = () => { try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} };
const upLv = id => save.up[id]||0;

// camera: world units → screen px
const cam = {x:0, y:0, z:1};
let VW = 0, VH = 0, DPR = 1;
const toWorld = (sx, sy) => ({x:(sx-cam.x)/cam.z, y:(sy-cam.y)/cam.z});
const toScreen = (x, y) => [x*cam.z+cam.x, y*cam.z+cam.y];
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  const r = $("game").getBoundingClientRect(); VW = r.width; VH = r.height;
  cv.width = Math.floor(VW*DPR); cv.height = Math.floor(VH*DPR);
  fitCamera();
}
addEventListener("resize", resize);

// input
const keys = new Set();
addEventListener("keydown", e => { if(modalOpen()){ if(e.code==="Escape" && modalClosable) closeModal(); return; } keys.add(e.code); audio(); if(e.code==="KeyP" && state==="play") setSpeed(G.speed===0?1:0); if(typeof onKey==="function") onKey(e); });
addEventListener("keyup", e => keys.delete(e.code));
let dragging = null;
cv.addEventListener("pointerdown", e => { audio(); try{ cv.setPointerCapture(e.pointerId); }catch(err){} const r = cv.getBoundingClientRect(), w = toWorld(e.clientX-r.left, e.clientY-r.top); dragging = {sx:e.clientX, sy:e.clientY, moved:false}; if(state==="play" && G.speed>0) onPointerDown(w.x, w.y); });
cv.addEventListener("pointermove", e => { const r = cv.getBoundingClientRect(), w = toWorld(e.clientX-r.left, e.clientY-r.top); if(dragging && Math.hypot(e.clientX-dragging.sx, e.clientY-dragging.sy)>8) dragging.moved = true; if(typeof onPointerMove==="function") onPointerMove(w.x, w.y, !!dragging); });
cv.addEventListener("pointerup", e => { const r = cv.getBoundingClientRect(), w = toWorld(e.clientX-r.left, e.clientY-r.top); const d = dragging; dragging = null; if(state==="play" && G.speed>0 && typeof onPointerUp==="function") onPointerUp(w.x, w.y, d && d.moved); });
cv.addEventListener("pointercancel", () => { dragging = null; if(typeof onPointerCancel==="function") onPointerCancel(); });

// floating text + particles in world space
function floatText(x,y,txt,col,big){ G.floats.push({x,y,txt,col:col||C.ink,life:1.4,big:!!big,rise:0}); }
function burst(x,y,n,col,spd=80,life=.6,size=4){ for(let i=0;i<n;i++){ const a=rand(0,6.28), v=rand(spd*.3,spd); G.particles.push({x,y,vx:Math.cos(a)*v, vy:Math.sin(a)*v-40, g:300, life, max:life, size:rand(size*.5,size), col}); } }
function sparkle(x,y){ for(let i=0;i<8;i++) G.particles.push({x:x+rand(-20,20), y:y+rand(-16,16), vx:0, vy:-14, g:0, life:.9, max:.9, size:rand(4,8), col:"star"}); }
function steam(x,y){ G.particles.push({x:x+rand(-4,4), y, vx:rand(-6,6), vy:rand(-26,-16), g:0, life:1.4, max:1.4, size:rand(3,6), col:"steam"}); }
function updateFx(dt){
  for(const p of G.particles){ p.life-=dt; p.vy += (p.g||0)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  G.particles = G.particles.filter(p=>p.life>0);
  for(const f of G.floats){ f.life-=dt; f.rise+=30*dt; }
  G.floats = G.floats.filter(f=>f.life>0);
}
function drawParticles(){
  for(const q of G.particles){
    const a = clamp(q.life/q.max,0,1); ctx.globalAlpha = a;
    if(q.col==="star"){ const s=q.size*(.5+a*.5); ctx.beginPath(); for(let i=0;i<8;i++){ const r=i%2?s*.35:s, an=i*Math.PI/4; ctx.lineTo(q.x+Math.cos(an)*r, q.y+Math.sin(an)*r); } ctx.closePath(); ctx.fillStyle="#fff6c8"; ctx.fill(); ctx.strokeStyle="#e2a62a"; ctx.lineWidth=1.1; ctx.stroke(); }
    else if(q.col==="steam"){ ctx.globalAlpha = a*.55; ctx.beginPath(); ctx.arc(q.x,q.y,q.size*(1.6-a*.6),0,6.3); ctx.fillStyle="#ffffff"; ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(q.x,q.y,q.size,0,6.3); ctx.fillStyle=q.col; ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
function drawBubble(sx, sy, txt){
  ctx.font="700 13px Nunito, sans-serif"; const w = Math.min(230, ctx.measureText(txt).width+20);
  const bx = clamp(sx-w/2, 6, VW-w-6), by = sy-40;
  ctx.shadowColor="rgba(60,40,20,.18)"; ctx.shadowBlur=10; ctx.shadowOffsetY=3;
  rr(bx,by,w,27,13); ctx.fillStyle="#fff8ec"; ctx.fill(); ctx.shadowColor="transparent";
  ctx.strokeStyle="#e6d6bb"; ctx.lineWidth=1.6; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx-6,by+26); ctx.lineTo(sx,by+34); ctx.lineTo(sx+6,by+26); ctx.fillStyle="#fff8ec"; ctx.fill();
  ctx.fillStyle=C.ink; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(txt, bx+w/2, by+14, w-12);
}
function drawFloats(){
  for(const f of G.floats){ const s = toScreen(f.x, f.y), age = 1.4 - f.life, k = clamp(age/.18, 0, 1), sc = 1 + .55*Math.sin(k*Math.PI)*(f.big?1:.6);
    ctx.save(); ctx.translate(s[0], s[1]-f.rise); ctx.scale(sc, sc);
    ctx.globalAlpha = clamp(f.life/.5,0,1); ctx.font = f.big ? "700 20px DynaPuff, Nunito, sans-serif" : "800 14px Nunito, sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.lineWidth=5; ctx.strokeStyle="#fff"; ctx.strokeText(f.txt, 0, 0); ctx.fillStyle=f.col; ctx.fillText(f.txt, 0, 0); ctx.restore(); }
  ctx.globalAlpha = 1;
}
function vignette(){
  const g = ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.45,VW/2,VH/2,Math.max(VW,VH)*.78);
  g.addColorStop(0,"rgba(50,35,20,0)"); g.addColorStop(1,"rgba(50,35,20,.18)"); ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
}

// toast
let toastT = null;
function announce(txt, icon){
  const el = $("toast"); el.innerHTML = `${ic(icon||"spark")}<span>${txt}</span>`; el.hidden = false; el.classList.remove("out");
  clearTimeout(toastT); toastT = setTimeout(()=>{ el.classList.add("out"); toastT = setTimeout(()=>{ el.hidden = true; }, 400); }, 3200);
}

// modals
let state = "menu", modalClosable = false, resumeSpeed = 1;
const modalOpen = () => !$("modal").hidden;
function openModal(html, closable=true){
  modalClosable = closable;
  $("modalCard").innerHTML = (closable ? `<button type="button" class="x" id="mX" aria-label="Kapat">${ic("x")}</button>` : "") + html;
  $("modal").hidden = false; $("modalCard").scrollTop = 0;
  if(closable) $("mX").onclick = closeModal;
  const f = $("modalCard").querySelector(".cta") || $("modalCard").querySelector(".x"); if(f) f.focus({preventScroll:true});
}
let modalPrev = null;
function closeModal(){ $("modal").hidden = true; if(state==="play" && modalPrev!==null){ setSpeed(modalPrev); modalPrev = null; } }
$("modal").addEventListener("click", e => { if(e.target===$("modal") && modalClosable) closeModal(); });
function pauseForModal(){ if(state==="play"){ if(modalPrev===null) modalPrev = G.speed; if(G.speed) resumeSpeed = G.speed; setSpeed(0); } }
function setSpeed(s){ if(!G) return; G.speed = s; document.querySelectorAll(".speed button").forEach(b => b.classList.toggle("on", +b.dataset.speed===s)); }
document.querySelectorAll(".speed button").forEach(b => b.onclick = () => { audio(); if(state==="play"){ const s=+b.dataset.speed; setSpeed(s); if(s) resumeSpeed = s; } });
function starsHtml(r){ let h=""; for(let i=1;i<=5;i++) h += r>=i-.25 ? "★" : `<span class="off">★</span>`; return h; }
const fmtTime = s => { s = Math.ceil(s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
function upgradesHtml(){
  return `<div class="ups">${UPGRADES.map(u => { const lv=upLv(u.id), max=u.costs.length, cost=u.costs[lv];
    return `<div class="up"><strong>${u.name}</strong><div class="lv">${Array.from({length:max},(_,i)=>`<i class="${i<lv?"on":""}"></i>`).join("")}</div><small>${u.desc}</small>
    <button type="button" data-up="${u.id}" ${lv>=max||save.money<cost?"disabled":""}>${lv>=max?"Tamamlandı":"₺"+cost+" · Satın al"}</button></div>`; }).join("")}</div>`;
}
function wireUpgrades(rerender){
  $("modalCard").querySelectorAll("[data-up]").forEach(b => b.onclick = () => {
    const u = UPGRADES.find(x=>x.id===b.dataset.up), lv=upLv(u.id), cost=u.costs[lv];
    if(save.money>=cost){ save.money-=cost; save.up[u.id]=lv+1; persist(); sfx.coin(); if(typeof applyUpgrades==="function") applyUpgrades(); rerender(); if(state==="play") updateHud(true); else $("hMoney").textContent = "₺"+save.money.toLocaleString("tr-TR"); }
  });
}
function showShop(){ pauseForModal(); const r = () => { openModal(`<h2>${ic("spark")}Geliştir</h2><p class="sub">Kasa: <b>₺${save.money}</b>. Yükseltmeler hemen etkili olur.</p>${upgradesHtml()}`); wireUpgrades(r); }; r(); }
function showSettings(){
  pauseForModal();
  openModal(`<h2>${ic("gear")}Ayarlar</h2><p class="sub">İlerleme bu tarayıcıda saklanır.</p>
  <div class="actions" style="justify-content:flex-start"><button type="button" class="ghost" id="bMusic">Müzik: ${musicOn?"açık":"kapalı"}</button><button type="button" class="ghost" id="bHelp">Nasıl oynanır?</button><button type="button" class="ghost" id="bReset">İlerlemeyi sıfırla</button></div>
  <div id="rc" hidden style="font-size:14px;margin-top:10px">Tüm para ve yükseltmeler silinecek.<div class="actions" style="justify-content:flex-start"><button type="button" class="cta" id="bResetYes">Evet, sıfırla</button></div></div>`);
  $("bReset").onclick = () => { $("rc").hidden = false; };
  $("bResetYes").onclick = () => { save = defaultSave(); persist(); clearShift(); newDay(); showWelcome(); };
  $("bHelp").onclick = () => openModal(welcomeHtml(false));
  $("bMusic").onclick = () => { musicOn = !musicOn; try{ localStorage.setItem(SAVE_KEY+"_music", musicOn?"1":"0"); }catch(e){} if(musicOn) audio(); else stopMusic(); $("bMusic").textContent = "Müzik: "+(musicOn?"açık":"kapalı"); };
}
// mid-shift autosave: games may define snapshotShift() / restoreShift(z) / clockAt(t)
const SHIFT_KEY = SAVE_KEY + "_shift";
let autoT = 0;
function autosave(){ if(state!=="play" || !G || typeof snapshotShift!=="function") return; persist(); try{ localStorage.setItem(SHIFT_KEY, JSON.stringify(Object.assign({day:save.day}, snapshotShift()))); }catch(e){} }
function clearShift(){ try{ localStorage.removeItem(SHIFT_KEY); }catch(e){} }
function savedShift(){ if(typeof restoreShift!=="function") return null; try{ const z = JSON.parse(localStorage.getItem(SHIFT_KEY)||"null"); return z && z.day===save.day && z.graph ? z : null; }catch(e){ return null; } }
function startShift(z){ audio(); $("modal").hidden = true; modalPrev = null; newDay(); if(z) restoreShift(z); TUTS = null; tutEl().hidden = true; if(save.day===1 && !save.tut && typeof tutorialSteps==="function") startTutorial(tutorialSteps()); state="play"; setSpeed(1); resumeSpeed=1; fitCamera(); updateHud(true); if(z) announce("Kaldığın yerden devam: "+$("hClock").textContent, "play"); }
function showPaused(){
  pauseForModal();
  openModal(`<h2>${ic("pause")}Mola</h2><p class="sub">Oyun duraklatıldı, ilerleme kaydedildi.</p><div class="actions"><button type="button" class="cta" id="bResume">Devam et ${ic("play")}</button></div>`);
  $("bResume").onclick = () => { if(modalPrev===0) modalPrev = resumeSpeed || 1; closeModal(); };
}
function showWelcome(){
  const z = savedShift(); state = "menu";
  if(z){
    const hh = typeof clockAt==="function" ? ", saat "+clockAt(z.t) : "";
    openModal(`<h2>${ic("play")}Yarım kalan gün</h2><p class="sub">Gün ${save.day}${hh}. Her şey bıraktığın gibi duruyor.</p>
      <div class="stats"><div class="stat"><span>Bugünkü kazanç</span><b>₺${z.revenue||0}</b></div><div class="stat"><span>${typeof SERVED_LABEL!=="undefined" ? SERVED_LABEL : "Hizmet"}</span><b>${z.served||0}</b></div><div class="stat"><span>Kasa</span><b>₺${save.money}</b></div></div>
      <div class="actions"><button type="button" class="cta" id="bGo">Kaldığın yerden devam et ${ic("play")}</button></div>`, false);
    $("bGo").onclick = () => startShift(z);
    return;
  }
  openModal(welcomeHtml(), false);
  $("bGo").onclick = () => startShift(null);

function packGraph(root, skip){

    if(ids.has(v)) return {$r:ids.get(v)};
    const id = table.length; ids.set(v, id); table.push(null);
    if(Array.isArray(v)) table[id] = {$a:v.map(x => { const e = enc(x); return e === undefined ? null : e; })};
    else { const o = {}; for(const k in v){ if(v === root && skip && skip.includes(k)) continue; const e = enc(v[k]); if(e !== undefined) o[k] = e; } table[id] = o; }
    return {$r:id};
  };

}
function unpackGraph(table){
  const objs = table.map(t => t && t.$a ? [] : {});
  const dec = v => (v === null || typeof v !== "object") ? v : v.$r !== undefined ? objs[v.$r] : v.$n !== undefined ? Number(v.$n) : v;
  table.forEach((t, i) => { if(t.$a) t.$a.forEach(x => objs[i].push(dec(x))); else for(const k in t) objs[i][k] = dec(t[k]); });
  return objs[0];

// ---------- state ----------
let G = null;
function stats(){ return { lines: 2 + upLv("hat"), cols: 4 + upLv("minibus"), wait: 22*(1 + .3*upLv("sofor")), qpat: 1 + .25*upLv("simit") }; }
function newCar(li, arriving){

function newDay(){

  for(const p of G.walkers){ const sl = qSlot(G.queue.length); p.x = p.tx = sl.x; p.y = p.ty = sl.y; p.state = "queue"; p.via = null; G.queue.push(p); }

function applyUpgrades(){ if(!G) return; G.S = stats(); while(G.cars.length < G.S.lines) G.cars.push(newCar(G.cars.length, true)); fitCamera(); }

// ---------- passengers ----------
let nextId = 1;
function typesToday(){ return Object.keys(TYPES).filter(k => TYPES[k].day <= save.day); }
function makePassenger(type, line, x, y){
  const T = TYPES[type], pat = T.patience*G.S.qpat;
  return {id:nextId++, type, T, line, x, y, tx:x, ty:y, state:"walk", patience:pat, maxPat:pat, skin:pick(SKINS), seed:rand(0,6), partner:null, bubble:null, ph:0, lx:x, ly:y, fc:-1, still:0, mood:"neutral"};
}
function spawnGroup(fromX, fromY){
  if(G.queue.length + G.walkers.length >= QPER*2-2) return;
  const pool = typesToday(), w = pool.map(k => k==="ogrenci"?3 : k==="cift"?1.2 : 1.5);
  let r = Math.random()*w.reduce((a,b)=>a+b,0), type = pool[0];
  for(let i=0;i<pool.length;i++){ r-=w[i]; if(r<=0){ type=pool[i]; break; } }
  const line = Math.floor(Math.random()*G.S.lines);
  const via = fromY < ROAD_Y0 ? [[760, fromY+18],[760, WALK_Y]] : null;
  const a = makePassenger(type, line, fromX, fromY); a.via = via && via.map(v=>[...v]); G.walkers.push(a);
  if(type==="cift"){ const b = makePassenger("cift", line, fromX+16, fromY+8); b.look = "cift2"; b.via = via && via.map(v=>[v[0]+14, v[1]+8]); a.partner = b; b.partner = a; G.walkers.push(b); }
}
function qSlot(i){ const per = VW < 760 ? 7 : QPER; return {x: QX0 - (i%per)*QDX, y: WALK_Y + Math.floor(i/per)*60}; }
function updatePassengers(dt){
  const rainMul = G.rain.on ? 1.5 : 1;
  for(const p of G.walkers){
    const via = p.via && p.via.length ? p.via[0] : null;
    const tx = via ? via[0] : qSlot(G.queue.length).x, ty = via ? via[1] : qSlot(G.queue.length).y;
    const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy), s = (via ? 170 : 120)*dt;
    if(via && d <= s){ p.x = tx; p.y = ty; p.via.shift(); }
    else if(d <= s){ p.x = tx; p.y = ty; p.state = "queue"; G.queue.push(p); p.done = true; if(Math.random()<.3) say(p, pick(["Kadıköy var mı?","Dolmuş ne zaman kalkar?","Yer var mı abi?","İnecek var!"])); }
    else { p.x += dx/d*s; p.y += dy/d*s; }
  }
  G.walkers = G.walkers.filter(p=>!p.done);
  G.queue.forEach((p,i) => {
    const sl = qSlot(i); p.tx = sl.x; p.ty = sl.y;
    if(p !== G.sel){ p.x = lerp(p.x, p.tx, Math.min(1, dt*6)); p.y = lerp(p.y, p.ty, Math.min(1, dt*6)); }
    p.patience -= dt*rainMul;
    if(p.patience < p.maxPat*.3 && !p.warned){ p.warned = true; say(p, pick(["Hâlâ mı?","Yürüyerek gideceğim!","Bu dolmuş kalkmayacak mı?"])); }
  });
  const gone = G.queue.filter(p => p.patience <= 0);
  for(const p of gone){
    G.angry++; G.satN++; say(p, pick(["Ben taksiye biniyorum!","Bu ne rezalet!","Vazgeçtim."]), 2); sfx.angry();
    floatText(p.x, p.y-60, "Gitti!", C.bad, true); { const sc = toScreen(p.x, p.y-30); badFx(sc[0], sc[1]); } if(G.sel===p) G.sel = null;
    p.state = "leave"; p.leaveV = -1; G.leavers = G.leavers || []; G.leavers.push(p);
  }
  if(gone.length) G.queue = G.queue.filter(p => p.patience > 0);
  for(const p of (G.leavers||[])){ p.x -= 160*dt; if(p.bubble){ p.bubble.t -= dt; } }
  if(G.leavers) G.leavers = G.leavers.filter(p => p.x > -400);
  for(const p of [...G.queue, ...G.walkers]) if(p.bubble){ p.bubble.t -= dt; if(p.bubble.t<=0) p.bubble = null; }
}
function say(p, txt, d=2.3){ p.bubble = {txt, t:d}; sfx.bark(); }

// ---------- seats ----------
const SEAT = {w:58, h:36, gx:66, gy:42, x0:22, y0:13};
function seatPos(car, c, r){ return {x: car.x + SEAT.x0 + c*SEAT.gx + SEAT.w/2, y: car.y + SEAT.y0 + r*SEAT.gy + SEAT.h/2}; }
function seatAt(car, c, r){ return car.seats[c*3 + r]; }
function setSeat(car, c, r, v){ car.seats[c*3 + r] = v; }
function seatHit(wx, wy){
  for(const car of G.cars){ if(car.state!=="idle") continue;
    for(let c=0;c<car.cols;c++) for(let r=0;r<3;r++){ const s = seatPos(car, c, r); if(Math.abs(wx-s.x) <= SEAT.gx/2 && Math.abs(wy-s.y) <= SEAT.gy/2) return {car, c, r}; } }
  return null;
}
function fitCells(p, car, c, r){
  if(TYPES[p.type].seats===2){
    const r2 = r<2 ? r+1 : r-1, a = Math.min(r, r2);
    if(!seatAt(car,c,a) && !seatAt(car,c,a+1)) return [[c,a],[c,a+1]];
    return null;
  }
  return seatAt(car, c, r) ? null : [[c, r]];
}
function isWindow(r){ return r===0 || r===2; }
// would placing p at (c,r) satisfy its request?
function wouldPlease(p, car, c, r){
  const T = TYPES[p.type], cells = fitCells(p, car, c, r); if(!T.req || !cells) return false;
  if(T.req==="window") return cells.some(([cc,rr]) => isWindow(rr));
  if(T.req==="door") return cells.some(([cc,rr]) => isDoor(cc, rr, car));
  if(T.req==="partner"){ const q = p.partner; if(!q || !q.seat || q.seat.car !== car) return false; const [c2,r2] = q.seat.cells[0]; return c2===c && Math.abs(r2-r)===1; }
  return false;
}
function drawStar(x, y, R, fill){ ctx.beginPath(); for(let i=0;i<10;i++){ const a = -Math.PI/2 + i*Math.PI/5, rad = i%2 ? R*.45 : R; ctx.lineTo(x + Math.cos(a)*rad, y + Math.sin(a)*rad); } ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = "#a8741a"; ctx.lineWidth = 1.2; ctx.stroke(); }
function isDoor(c, r, car){ return r===2 && (c===1 || c===2); }
function evalMood(p){
  if(!p.seat) return "neutral";
  const {car, cells} = p.seat, T = TYPES[p.type];
  if(T.req==="window") return cells.some(([c,r]) => isWindow(r)) ? "happy" : "sad";
  if(T.req==="door") return cells.some(([c,r]) => isDoor(c, r, car)) ? "happy" : "sad";
  if(T.req==="partner"){ const q = p.partner; if(!q || !q.seat || q.seat.car !== car) return "sad"; const [c1,r1] = cells[0], [c2,r2] = q.seat.cells[0]; return (c1===c2 && Math.abs(r1-r2)===1) ? "happy" : "sad"; }
  return "happy";
}
function place(p, car, c, r){
  if(car.line !== p.line){ say(p, `${LINES[p.line].to} gidiyorum, bu ${LINES[car.line].name} dolmuşu!`, 2.2); floatText(car.x + car.w/2, car.y - 8, `Yanlış hat: ${LINES[p.line].name} yolcusu`, C.bad); sfx.nope(); shakeT = .25; return false; }
  const cells = fitCells(p, car, c, r);
  if(!cells){ sfx.nope(); floatText(seatPos(car,c,r).x, seatPos(car,c,r).y-30, TYPES[p.type].seats===2 ? "Yan yana iki boş koltuk lazım" : "Dolu", C.bad); return false; }
  if(p.seat) unseat(p);
  G.queue = G.queue.filter(q => q !== p);
  cells.forEach(([cc,rr2]) => setSeat(car, cc, rr2, p));
  p.seat = {car, cells}; p.state = "seated";
  const sp = seatPos(car, cells[0][0], cells[0][1]); p.sx = sp.x; p.sy = TYPES[p.type].seats===2 ? (sp.y + seatPos(car, cells[1][0], cells[1][1]).y)/2 : sp.y;
  p.anim = {fx:p.x, fy:p.y, t:0};
  if(!car.waiting){ car.waiting = true; car.wait = G.S.wait; }
  sfx.sit(); { const sc = toScreen(p.sx, p.sy), m = evalMood(p); if(TYPES[p.type].req && m==="happy"){ ringFx(sc[0], sc[1], C.good, 34); sfx.sparkle(); } else ringFx(sc[0], sc[1], "#ffffff", 22); }
  if(car.seats.every(s => s)) { floatText(car.x + car.w/2, car.y - 8, "Dolu! Yolla!", C.good, true); }

}
function unseat(p){ const {car, cells} = p.seat; cells.forEach(([c,r]) => setSeat(car, c, r, null)); p.seat = null; }
function depart(car){
  const ps = [...new Set(car.seats.filter(Boolean))]; if(!ps.length || car.state!=="idle") return;
  const full = car.seats.every(s => s);
  let amt = 0;
  for(const p of ps){ const m = evalMood(p); amt += 2 + (m==="happy" && TYPES[p.type].req ? 1 : 0); G.satSum += m==="happy" ? 100 : 60; G.satN++; G.served++; }
  if(full) amt = Math.round(amt*1.25);
  save.money += amt; G.revenue += amt;
  floatText(car.x + car.w/2, car.y + CAR.h/2, (full ? "TAM! " : "") + "+₺"+amt, full ? C.good : C.coral, true);
  full ? sfx.tam() : sfx.coin(); sfx.horn(); { const sc = toScreen(car.x + car.w/2, car.y + CAR.h/2); payFx(sc[0], sc[1], amt); }
  if(full) for(let i=0;i<10;i++) sparkle(car.x + rand(0, car.w), car.y + rand(0, CAR.h));

let shakeT = 0;

// ---------- update ----------
function update(dt){
  tension(G.queue.length ? Math.min(...G.queue.map(p => p.patience/p.maxPat)) : 1, dt);
  G.t += dt;
  if(G.t >= G.dayLen && !G.closing){ G.closing = true; announce("Son seferler! Durağı boşalt.", "sun"); }
  // vapur waves
  const v = G.vapur;
  if(v.state==="away"){ v.next -= dt; if(v.next <= 0 && !G.closing){ v.state = "in"; v.x = 760; sfx.ship(); announce("Vapur yanaştı! Kalabalık geliyor.", "ship"); } }
  else if(v.state==="in"){ v.x = lerp(v.x, 470, Math.min(1, dt*2.2)); if(v.x < 474){ v.state = "dock"; v.t = 0; v.n = 5 + save.day + (Math.random()<.5?1:0); v.k = 0; } }
  else if(v.state==="dock"){ v.t += dt; if(v.k < v.n && v.t > .5 + v.k*.45){ v.k++; spawnGroup(520 + rand(-20,20), 150); } if(v.t > 7){ v.state = "out"; } }
  else if(v.state==="out"){ v.x += 120*dt; if(v.x > 760){ v.state = "away"; v.next = Math.max(22, 34 - save.day*2)*rand(.9,1.1); } }
  if(!G.closing){ G.trickle -= dt; if(G.trickle<=0){ G.trickle = Math.max(4, 9 - save.day)*rand(.8,1.2); spawnGroup(-30, WALK_Y + rand(-10,10)); } }
  // rain
  const rn = G.rain; if(!rn.on && G.t >= rn.at && !rn.done){ rn.on = true; rn.t = 25; announce("Yağmur başladı! Sıradakiler çabuk sinirleniyor.", "rain"); v.next = Math.min(v.next, 3); }
  if(rn.on){ rn.t -= dt; if(rn.t<=0){ rn.on = false; rn.done = true; } }
  updatePassengers(dt);
  // cars

  const people = [...G.queue, ...G.walkers, ...(G.leavers||[])].sort((a,b)=>a.y-b.y);
  for(const p of people){ trackMotion(p); if(p !== G.sel) drawQueuePerson(p, false); }
  if(G.sel){ const p = G.sel; if(G.drag && G.drag.moved){ ctx.globalAlpha = .9; drawSeatedTop(G.drag.x, G.drag.y, LOOKS2[p.look||p.type], p.skin, "neutral", false, true); ctx.globalAlpha = 1; }
    else if(!p.seat) drawQueuePerson(p, true); }
  drawParticles();
  drawRain();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  vignette();
  for(const p of [...G.queue, ...(G.leavers||[]), ...seatedAll()]) if(p.bubble){ const sc = p.seat ? toScreen(p.sx, p.sy - 20) : toScreen(p.x, p.y - 74); drawBubble(sc[0], sc[1], p.bubble.txt); }
  drawFloats();
  if(G.closing){ ctx.fillStyle="rgba(40,30,60,.08)"; ctx.fillRect(0,0,VW,VH); }
}

// ---------- HUD ----------
let hudT = 0, lastL = "", lastQ = "";
function updateHud(force){
  hudT -= 1; if(hudT>0 && !force) return; hudT = 8;
  const prog = clamp(G.t/G.dayLen,0,1), mins = 7*60 + Math.floor(prog*14*60);
  $("hDay").textContent = save.day;
  $("hClock").textContent = String(Math.floor(mins/60)).padStart(2,"0")+":"+String(Math.floor(mins%60/10)*10).padStart(2,"0");
  $("hBar").style.width = (prog*100).toFixed(1)+"%";
  $("hOpen").textContent = G.closing ? "Son sefer" : "Açık"; $("hOpen").classList.toggle("closed", G.closing);
  $("hMoney").textContent = "₺"+save.money.toLocaleString("tr-TR");
  const rating = G.satN ? G.satSum/G.satN/20 : 3;
  $("hStars").innerHTML = starsHtml(rating); $("hRate").textContent = rating.toFixed(1).replace(".",",");
  const v = G.vapur, hot = v.state!=="away";
  $("hWave").textContent = G.rain.on ? "Yağmur!" : hot ? "Vapur yanaştı" : `Vapur ${fmtTime(v.next)}`; $("hWavePill").classList.toggle("hot", hot || G.rain.on);
  const lh = G.cars.map((car,i) => { const n = car.seats.filter(Boolean).length; return `<div class="line"><span class="sw" style="background:${LINES[car.line].col}"></span><span class="nm">${LINES[car.line].name}</span><span class="seats">${car.state==="idle" ? n+"/"+car.seats.length : "yolda"}</span><button type="button" data-dep="${i}" ${car.state!=="idle"||!n?"disabled":""}>Yolla</button></div>`; }).join("");
  if(lh !== lastL){ $("lines").innerHTML = lh; lastL = lh; }
  const q = G.queue;
  $("qCount").textContent = q.length; $("qCount").classList.toggle("zero", !q.length);
  const counts = LINES.slice(0, G.S.lines).map((L,i) => [L, q.filter(p=>p.line===i).length]);
  const qh = q.length ? counts.map(([L,n]) => `<div class="q"><span class="dot" style="background:${L.col}"></span><span class="nm">${L.name}</span><span>${n} kişi</span></div>`).join("") : `<p class="idle">Durak boş. Vapuru bekle.</p>`;
  if(qh !== lastQ){ $("qList").innerHTML = qh; lastQ = qh; }
  const chip = $("nextTask");
  if(state==="play" && $("side").hidden){ const t = nextTask(); chip.innerHTML = `${ic(t.icon)}<small>Sıradaki</small><span>${t.txt}</span>`; chip.className = "nexttask" + (t.urgent ? " urgent" : ""); chip.hidden = false; chip.onclick = () => { audio(); if(t.go) t.go(); }; }
  else chip.hidden = true;
}
function nextTask(){
  if(TUTS) return tutChip();
  const full = G.cars.find(c => c.state==="idle" && c.seats.every(Boolean));
  if(full) return {icon:"bus", txt:`${LINES[full.line].name} dolu, yolla!`, urgent:true, go:()=>depart(full)};
  const hurry = G.cars.find(c => c.state==="idle" && c.waiting && c.wait < 5);
  if(hurry) return {icon:"bus", txt:`${LINES[hurry.line].name} şoförü sabırsız`, urgent:true, go:()=>depart(hurry)};
  if(G.sel) return {icon:"hand", txt:"Yeşil yanan koltuğa dokun", urgent:false, go:null};
  const p = [...G.queue].sort((a,b)=>a.patience-b.patience)[0];
  if(p) return {icon:"users", txt:`${TYPES[p.type].name} · ${LINES[p.line].name}`, urgent: p.patience < p.maxPat*.35, go:()=>{ G.sel = p; sfx.pick(); }};
  return {icon:"ship", txt:"Vapuru bekle", urgent:false, go:null};
}
$("lines").addEventListener("click", e => { const b = e.target.closest("[data-dep]"); if(!b || state!=="play") return; audio(); depart(G.cars[+b.dataset.dep]); });
$("dTasks").onclick = () => { const h = !$("side").hidden; $("side").hidden = h; $("dTasks").classList.toggle("on", !h); resize(); };
$("dCodex").onclick = () => { audio(); if(state!=="play") return; pauseForModal();
  openModal(`<h2>${ic("users")}Yolcular</h2><p class="sub">İsteği karşılanan yolcu bahşiş verir.</p><div class="codex">${Object.entries(TYPES).map(([k,t]) => { const open = t.day<=save.day; return `<div class="ct${open?"":" locked"}"><span class="dot" style="background:${open?LOOKS2[k].shirt:"#e8dcc7"}"></span><div><strong>${open?t.name:"???"}</strong><p>${open?t.desc:"Gün "+t.day+"'de gelecek."}</p></div></div>`; }).join("")}</div>`); };
function statsHtml(){ const rating = G.satN ? G.satSum/G.satN/20 : 0;
  return `<div class="stats"><div class="stat"><span>Kazanç</span><b>₺${G.revenue}</b></div><div class="stat"><span>Taşınan</span><b>${G.served}</b></div><div class="stat"><span>Gidip giden</span><b>${G.angry}</b></div><div class="stat"><span>Puan</span><b>${G.satN?rating.toFixed(1).replace(".",","):"–"}</b></div></div>`; }
$("dReport").onclick = () => { audio(); if(state!=="play") return; pauseForModal(); openModal(`<h2>${ic("chart")}Bugünün raporu</h2><p class="sub">Gün ${save.day} · şu ana kadar</p>${statsHtml()}<p class="sub">En iyi günlük kazanç: ₺${save.best||0}</p>`); };

function welcomeHtml(withCta=true){
  const day1 = save.day===1, touch = VW < 760 || (window.matchMedia && matchMedia("(pointer: coarse)").matches);
  if(day1 && withCta && !save.tut) return `<h2>${ic("bus")}Dolmuş Durağı'na hoş geldin!</h2>
  <p class="sub">Karaköy iskelesinin önündeki durağın çığırtkanı sensin. İşin üç adımı var:</p>
  <div class="steps">
    <div class="step"><b>1</b>${ic("users")}<strong>Yolcuyu seç</strong><small>Kafasının üstünde gideceği hat yazar</small></div>
    <div class="step"><b>2</b>${ic("hand")}<strong>Oturt</strong><small>Yeşil koltuğa dokun; yıldızlı koltuk isteğini karşılar</small></div>
    <div class="step"><b>3</b>${ic("bus")}<strong>Yolla!</strong><small>Tam dolu dolmuş %25 fazla kazandırır</small></div>
  </div>
  <div class="tip">${ic("spark")}<span>Şoförün sabrı biterse dolmuş kendisi kalkar. İlk yolcuyu oyunda birlikte oturtacağız.</span></div>
  <div class="actions"><button type="button" class="cta" id="bGo">Durağı aç ${ic("play")}</button></div>`;
  const news = save.day===2 ? `<div class="newb"><span class="dot" style="background:${LOOKS2.cift.shirt}"></span><div><b>Yeni yolcu: Çift</b><br><span style="font-size:13px;color:var(--muted)">${TYPES.cift.desc} Bir de yağmur bekleniyor.</span></div></div>` : "";
  return `<h2>${ic("bus")}${day1 ? "Dolmuş Durağı'na hoş geldin!" : "Gün "+save.day+" başlıyor"}</h2>
  <p class="sub">${day1 ? "Karaköy iskelesinin önündeki durağın çığırtkanı sensin. Arkadakiler biraz sıkışsın." : "Vapurlar yanaşıyor, dolmuşlar hazır."}</p>
  <div class="cols">
    <div class="box"><h4>${ic("list")}Durak</h4><ul>
      <li>${ic("users")}<span>Yolcunun kafasının üstünde <b>gideceği hat</b> yazar. Onu kendi hattının dolmuşuna oturt.</span></li>
      <li>${ic("spark")}<span>Bazı yolcuların <b>isteği</b> var: cam kenarı, kapıya yakın, yanında sevgilisi. İstek karşılanırsa bahşiş gelir.</span></li>
      <li>${ic("bus")}<span>Dolmuş dolunca <b>Yolla!</b> de: tam dolu kalkan dolmuş %25 fazla kazandırır. Şoförün sabrı biterse kendisi kalkar.</span></li>
      <li>${ic("ship")}<span>Vapur yanaşınca kalabalık gelir; üstteki sayaç sonraki vapuru gösterir.</span></li>
    </ul></div>
    <div class="box"><h4>${ic("move")}Kontroller</h4><ul>
      <li>${ic("hand")}<span><b>${touch ? "Dokun" : "Tıkla"}:</b> sıradaki yolcuyu seç, sonra yeşil yanan koltuğa ${touch ? "dokun" : "tıkla"}.</span></li>
      <li>${ic("hand")}<span>İstersen <b>sürükle bırak</b>: yolcuyu tutup koltuğa taşı.</span></li>
      <li>${ic("hand")}<span>Oturan yolcuya dokunursan yerini değiştirebilirsin.</span></li>
    </ul></div>
  </div>
  ${withCta ? news : ""}
  <div class="tip">${ic("spark")}<span>Valizli teyze iki koltuk kaplar: yan yana iki boş koltuk bul, kapıya yakın olsun.</span></div>
  ${withCta ? `<div class="actions"><button type="button" class="cta" id="bGo">${day1?"Durağı aç":"Sefere başla"} ${ic("play")}</button></div>` : ""}`;
}
// ---------- first placement, hands-on ----------
const TUT_DONE = "Harika, ilk dolmuş yolda! Vapur yanaşınca kalabalık gelir.";
function bestSeat(p){
  const car = G.cars.find(c => c.line===p.line && c.state==="idle"); if(!car) return null;
  let best = null;
  for(let c=0;c<car.cols;c++) for(let r=0;r<3;r++){ if(!fitCells(p, car, c, r)) continue; if(wouldPlease(p, car, c, r)) return {car, c, r}; if(!best) best = {car, c, r}; }
  return best;
}
function tutorialSteps(){
  const placed = () => seatedAll().length > 0 || G.served > 0;
  return [
    {icon:"users", hint:"Sıradaki yolcuya dokun. Başındaki etiket <b>gideceği hattı</b> gösterir.", chip:"Sıradaki yolcuya dokun", target:() => { const p = G.queue[0]; return p ? [p.x, p.y-40] : null; },
      done:() => !!G.sel || placed(), go:() => { if(G.queue[0]){ G.sel = G.queue[0]; sfx.pick(); } }},
    {icon:"hand", hint:"Yeşil koltuğa dokun. <b>★ yıldızlı</b> koltuk yolcunun isteğini karşılar, bahşiş getirir.", chip:() => { const b = G.sel && bestSeat(G.sel); return b && wouldPlease(G.sel, b.car, b.c, b.r) ? "Yıldızlı koltuğa dokun" : "Yeşil koltuğa dokun"; }, target:() => { const b = G.sel && bestSeat(G.sel); if(!b) return null; const sp = seatPos(b.car, b.c, b.r); return [sp.x, sp.y]; },
      done:placed, go:() => { const b = G.sel && bestSeat(G.sel); if(b && place(G.sel, b.car, b.c, b.r)) G.sel = null; }},
    {icon:"bus", hint:"Dolmuşu doldurmaya devam et ya da <b>Yolla!</b> ile gönder.", chip:"Yolla! ile dolmuşu gönder", target:() => { const car = G.cars.find(c => c.state==="idle" && c.seats.some(Boolean)); if(!car) return null; const Y = yolla(car); return [Y.bx + Y.w/2, Y.by + Y.h/2]; },
      done:() => G.served > 0, go:() => { const car = G.cars.find(c => c.state==="idle" && c.seats.some(Boolean)); if(car) depart(car); }},
  ];
}

// ---------- mid-shift save ----------
const SERVED_LABEL = "Taşınan";
function clockAt(t){ const m = 7*60 + Math.floor(clamp(t/DAY_LEN,0,1)*14*60); return String(Math.floor(m/60)).padStart(2,"0")+":"+String(Math.floor(m%60/10)*10).padStart(2,"0"); }
function snapshotShift(){ return {t:G.t, revenue:G.revenue, served:G.served, graph:packGraph(G, ["particles","floats","drag","hover"])}; }
function restoreShift(z){
  G = unpackGraph(z.graph); G.particles = []; G.floats = []; G.drag = null; G.hover = null;
  for(const p of [...G.queue, ...G.walkers, ...(G.leavers||[]), ...seatedAll()]) p.T = TYPES[p.type];
}

function endDay(){
  state = "end"; setSpeed(0);
  const rating = G.satN ? G.satSum/G.satN/20 : 0;
  const quip = rating>=4.5 ? "Durağın efsanesi oldun, şoförler sana çay ısmarlıyor." : rating>=3.5 ? "Arkadakiler sıkıştı ama herkes evine vardı." : rating>=2.5 ? "Biraz kaos, biraz korna. İstanbul işte." : "Bugün yolcuların yarısı yürüyerek gitti.";
  save.best = Math.max(save.best||0, G.revenue);
  const finished = save.day; save.day++; persist();
  const r = () => { openModal(`<h2>${ic("sun")}Gün ${finished} bitti</h2><p class="sub">${quip}</p>${statsHtml()}<div class="box" style="background:transparent;border:0;padding:0"><h4>${ic("spark")}Geliştir · Kasa ₺${save.money}</h4></div>${upgradesHtml()}<div class="actions"><button type="button" class="cta" id="bNext">Gün ${save.day}'e geç ${ic("play")}</button></div>`, false); wireUpgrades(r); $("bNext").onclick = () => showWelcome(); };
  endSequence("Son sefer!", `Gün ${finished} · ${G.served} yolcu · ₺${G.revenue}`, "#e2a62a", r);
}

// attract scene
newDay();
["ogrenci","teyze","cocuk","ogrenci","teyze"].forEach((t,i) => { const sl = qSlot(i); const p = makePassenger(t, i%2, sl.x, sl.y); p.state = "queue"; G.queue.push(p); });
place(makePassenger("ogrenci", 0, 300, 700), G.cars[0], 0, 0); place(makePassenger("cocuk", 0, 300, 700), G.cars[0], 1, 0);
G.cars.forEach(c => { c.waiting = false; });
seatedAll().forEach(p => p.anim = null);
resize(); updateHud(true);
if(VW < 760){ $("side").hidden = true; $("dTasks").classList.remove("on"); }
showWelcome();
requestAnimationFrame(loop);
})();
</script>

<script>try{ if(window.top===window) document.getElementById("backSite").hidden=false; }catch(e){}</script>
