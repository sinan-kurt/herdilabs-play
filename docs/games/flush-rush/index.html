<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e2694f">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<meta name="description" content="Flush Rush: istasyonun en kaotik umumi tuvaletini işlet. Tarayıcıda ücretsiz oyna.">
<title>Flush Rush · Herdilabs Mola Oyunları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@600;700&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: tam ekran izometrik dünya; üstte hap şeklinde HUD, solda yüzen krem paneller, altta ikonlu dock. Tek görsel dünya, tema bağımsız. */
:root{
  --cream:#fff8ec; --cream-a:rgba(255,248,236,.95); --line:#e6d6bb; --ink:#3b3226; --muted:#8b7b66;
  --coral:#e2694f; --orange:#e8813a; --mint:#4fb08f; --mint-soft:#dff2e8; --mustard:#e2a62a; --bad:#d64545; --good:#3f9b5f;
  --grass:#a3d47c;
  --shadow:0 10px 30px rgba(60,40,20,.18),0 2px 6px rgba(60,40,20,.12);
  --display:"DynaPuff","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:#2a2e31;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
#game{position:relative;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
canvas.panning{cursor:grabbing}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.topbar{position:absolute;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none;font-variant-numeric:tabular-nums}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;background:var(--coral);color:#fff;border-radius:999px;padding:7px 16px;font-family:var(--display);font-weight:700;font-size:16px;box-shadow:var(--shadow);letter-spacing:.01em}
.pill{display:flex;align-items:center;gap:6px;background:var(--cream);border:1.6px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
.pill .i{color:var(--orange)}
#hTrainPill .i{color:#2fa39a}
#hTrainPill.hot{background:#2fa39a;color:#fff;border-color:#2fa39a}
#hTrainPill.hot .i{color:#f2c230}
.stars{color:var(--mustard);letter-spacing:1px;font-size:14px}
.stars .off{color:#e2d5c0}
.tag{font-size:11px;font-weight:900;border-radius:999px;padding:2px 7px;background:var(--mint-soft);color:var(--good)}
.tag.closed{background:#fbe1dc;color:var(--bad)}
.speed{display:flex;gap:2px;background:var(--cream);border:1.6px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.speed button{font:inherit;font-weight:900;font-size:12px;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:4px 10px;display:flex;align-items:center;gap:3px;cursor:pointer}
.speed button.on{background:#fde6cf;color:var(--orange)}
.clockbar{width:54px;height:6px;border-radius:9px;background:#efe3cf;overflow:hidden}
.clockbar i{display:block;height:100%;background:var(--orange);width:0}

.side{position:absolute;left:12px;top:64px;width:270px;display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 160px);overflow:auto;padding-bottom:4px}
.panel{background:var(--cream-a);border:1.6px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow)}
.panel h3{display:flex;align-items:center;gap:7px;margin:0 0 6px;font-size:15px;font-weight:900}
.panel h3 .i{color:var(--coral)}
.badge{margin-left:auto;min-width:20px;height:20px;border-radius:999px;background:var(--coral);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 6px}
.badge.zero{background:#e8dcc7;color:var(--muted)}
.idle{font-size:13px;color:var(--muted);font-style:italic;margin:2px 4px 4px}
.list{display:flex;flex-direction:column;gap:5px}
.task{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:#fff;border:1.4px solid var(--line);border-radius:11px;padding:7px 9px;cursor:pointer}
.task:hover{border-color:var(--orange)}
.task .i{color:var(--muted)}
.task.urgent{border-color:#f0b4a7;background:#fff4f1}
.task.urgent .i{color:var(--bad)}
.task.busy{opacity:.55;background:#f7f1e6;border-style:dashed}
.task span{min-width:0;flex:1}
.q{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:3px 2px}
.q .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:none}
.q .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .bar{width:60px;height:6px;border-radius:9px;background:#efe3cf;overflow:hidden;flex:none}
.q .bar i{display:block;height:100%}
.carry{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}
.rolls{display:flex;gap:3px;margin-left:auto}
.rolls i{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.rolls i.e{border-color:#d9cbb2;background:transparent}

.dock{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;background:rgba(255,248,236,.96);border:1.6px solid var(--line);border-radius:22px;padding:6px;box-shadow:var(--shadow);max-width:calc(100% - 24px);overflow-x:auto}
.dock button{font:inherit;font-size:12px;font-weight:800;color:var(--ink);background:transparent;border:0;border-radius:16px;padding:6px 10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:58px}
.dock button .i{width:20px;height:20px;color:var(--coral)}
.dock button:hover,.dock button.on{background:#fde9d6}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}

.modal-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(59,50,38,.28)}
.modal{background:var(--cream);border:1.6px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(60,40,20,.3);width:min(720px,100%);max-height:100%;overflow:auto;padding:20px 22px;position:relative;box-sizing:border-box}
.modal h2{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:24px;margin:0;padding-right:36px;text-wrap:balance}
.modal h2 .i{width:24px;height:24px;color:var(--coral)}
.modal .sub{color:var(--muted);font-size:14px;margin:4px 0 14px}
.x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:1.6px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.box{background:#fff;border:1.6px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.box h4{display:flex;align-items:center;gap:7px;margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--coral)}
.box ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.box li{display:flex;gap:9px;font-size:13.5px;line-height:1.45}
.box li .i{margin-top:2px;color:var(--orange)}
.tip{display:flex;gap:8px;align-items:center;background:#fdf1dc;border-radius:12px;padding:9px 12px;font-size:13px;margin-top:12px}
.tip .i{color:var(--mustard)}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.cta{font:inherit;font-weight:900;font-size:15px;color:#fff;background:var(--coral);border:0;border-radius:12px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 12px rgba(226,105,79,.35);display:flex;align-items:center;gap:7px}
.ghost{font:inherit;font-weight:800;font-size:14px;color:var(--ink);background:#fff;border:1.6px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px;margin-bottom:14px;font-variant-numeric:tabular-nums}
.stat{background:#fff;border:1.6px solid var(--line);border-radius:14px;padding:9px 12px}
.stat span{display:block;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-size:22px}
.ups{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.up{background:#fff;border:1.6px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:3px}
.up strong{font-size:15px;font-weight:900}
.up small{color:var(--muted);font-size:12.5px;line-height:1.4;flex:1}
.lv{display:flex;gap:3px;margin:3px 0}
.lv i{flex:1;height:5px;border-radius:9px;background:#efe3cf}
.lv i.on{background:var(--mint)}
.up button{font:inherit;font-weight:900;font-size:13px;margin-top:6px;background:var(--mustard);color:var(--ink);border:0;border-radius:9px;padding:7px;cursor:pointer}
.up button:disabled{background:#efe7da;color:var(--muted);cursor:not-allowed}
.codex{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.ct{display:flex;gap:10px;background:#fff;border:1.6px solid var(--line);border-radius:14px;padding:10px 12px}
.ct .dot{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);flex:none}
.ct div{min-width:0}
.ct strong{font-size:14px;font-weight:900}
.ct p{margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.4}
.ct.locked{opacity:.55}
.modal>.actions:last-child{position:sticky;bottom:-20px;margin:14px -22px -20px;padding:12px 22px;background:var(--cream);border-top:1.6px solid var(--line)}
.newb{display:flex;gap:12px;align-items:center;background:#fdf1dc;border:1.6px dashed #e8c98f;border-radius:14px;padding:10px 12px;margin-top:10px}
.newb .dot{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);flex:none}

#toast{position:absolute;left:50%;top:116px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);background:#1f6f68;color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:800;box-shadow:var(--shadow);transition:opacity .35s, transform .35s;pointer-events:none;z-index:2}
#toast .i{color:#f2c230;width:18px;height:18px}
#toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast.out{opacity:0;transform:translate(-50%,-8px)}
@media (max-width:760px){#toast{top:150px;font-size:12.5px}}
.nexttask{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);font:inherit;font-size:14px;font-weight:900;color:var(--ink);background:#fff;border:1.6px solid var(--line);border-radius:999px;padding:9px 16px 9px 12px;box-shadow:var(--shadow);cursor:pointer;white-space:nowrap}
.tuthint{position:absolute;left:50%;top:64px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);background:#fff8ec;border:2px solid #f2c230;border-radius:14px;padding:8px 14px;font-size:14px;font-weight:700;box-shadow:var(--shadow);pointer-events:none;z-index:1}
.tuthint .i{width:18px;height:18px;color:var(--coral)}
@media (max-width:760px){.tuthint{top:112px;font-size:13px}}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{position:relative;background:#fff;border:1.6px solid var(--line);border-radius:14px;padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.step>b{position:absolute;top:-9px;left:-6px;width:22px;height:22px;border-radius:50%;background:var(--coral);color:#fff;font-size:12px;display:grid;place-items:center}
.step .i{width:26px;height:26px;color:var(--coral)}
.step strong{font-size:14px;font-weight:900}
.step small{font-size:12px;color:var(--muted);line-height:1.35}
.ministat{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(136px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;pointer-events:none}
.ministat>span{display:flex;align-items:center;gap:5px;background:var(--cream-a);border:1.6px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:800;box-shadow:var(--shadow);white-space:nowrap}
.ministat .i{width:14px;height:14px;color:var(--coral)}
.ministat .warn{background:#fff4f1;border-color:#f0b4a7;color:var(--bad)}
.nexttask span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.nexttask small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:900}
.nexttask .i{width:18px;height:18px;color:var(--coral)}
.nexttask.urgent{background:#fff4f1;border-color:#f0b4a7}
.nexttask.urgent .i{color:var(--bad)}
.nexttask.calm .i{color:var(--good)}
@media (max-width:760px){
  .side{width:min(240px,calc(100% - 24px));top:auto;bottom:96px;max-height:42%}
  .brand span{display:none}
  .pill{padding:5px 10px;font-size:13px}
  .clockbar{display:none}
  .dock button{min-width:50px;padding:5px 7px 3px;font-size:11px}
}
/* juice */
.modal-wrap:not([hidden]){animation:mwIn .28s ease-out both}
.modal-wrap:not([hidden]) .modal{animation:mIn .42s cubic-bezier(.2,1.4,.4,1) both}
@keyframes mwIn{from{background:rgba(59,50,38,0)}}
@keyframes mIn{from{opacity:0;transform:translateY(26px) scale(.9)}}
.pill.bump{animation:bump .38s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{40%{transform:scale(1.18);background:#fff3c4}}
.stat b.pop{animation:bump .4s cubic-bezier(.2,1.6,.4,1);display:inline-block}
@media (prefers-reduced-motion:reduce){.modal-wrap:not([hidden]),.modal-wrap:not([hidden]) .modal,.pill.bump,.stat b.pop{animation:none}}
</style>

<div id="game">
  <canvas id="cv" aria-label="Flush Rush oyun alanı"></canvas>

  <div class="topbar">
    <a class="pill" id="backSite" href="../../index.html" hidden style="text-decoration:none;color:inherit">← Mola Oyunları</a>
    <div class="brand"><svg class="i"><use href="#i-toilet"/></svg><span>Flush Rush</span></div>
    <div class="pill"><svg class="i"><use href="#i-wallet"/></svg><span id="hMoney">₺0</span></div>
    <div class="pill"><span class="stars" id="hStars"></span><span id="hRate">3,0</span></div>
    <div class="pill"><svg class="i"><use href="#i-sun"/></svg>Gün <span id="hDay">1</span> <span id="hClock">09:00</span><span class="clockbar"><i id="hBar"></i></span><span class="tag" id="hOpen">Açık</span></div>
    <div class="pill" id="hTrainPill"><svg class="i"><use href="#i-train"/></svg><span id="hTrain">Tren 0:05</span></div>
    <div class="speed" role="group" aria-label="Oyun hızı">
      <button type="button" data-speed="0" aria-label="Duraklat"><svg class="i"><use href="#i-pause"/></svg></button>
      <button type="button" data-speed="1" class="on"><svg class="i"><use href="#i-play"/></svg>1×</button>
      <button type="button" data-speed="2"><svg class="i"><use href="#i-ff"/></svg>2×</button>
    </div>
  </div>

  <aside class="side" id="side">
    <section class="panel">
      <h3><svg class="i"><use href="#i-door"/></svg>Kuyruk<span class="badge zero" id="qCount">0</span></h3>
      <div id="qList"><p class="idle">Kapı sakin... bir paspas sallayalım.</p></div>
    </section>
    <section class="panel">
      <h3><svg class="i"><use href="#i-list"/></svg>Yapılacaklar<span class="badge zero" id="tCount">0</span></h3>
      <div class="list" id="tList"></div>
    </section>
    <section class="panel carry">
      <svg class="i" style="color:var(--coral)"><use href="#i-cart"/></svg>Sepet<span class="rolls" id="rolls"></span>
    </section>
  </aside>

let actx = null, soundOn = true, musicOn = true;
try{ musicOn = localStorage.getItem("flushrush_music") !== "0"; }catch(e){}
function audio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==="suspended") actx.resume(); if(actx && soundOn && musicOn && !document.hidden) startMusic(); }

// ---- background music: bouncy C–Am–F–G loop, scheduled ahead on the audio clock ----
const N = {G4:392, A4:440, C5:523.25, D5:587.33, E5:659.25, G5:783.99, A5:880};
const PROG = [[65.41,[261.63,329.63,392]], [55,[220,261.63,329.63]], [43.65,[174.61,220,261.63]], [49,[196,246.94,293.66]]];
const MEL = [
  [[N.E5,0,N.G5,N.E5,N.D5,0,N.C5,0],[N.C5,0,N.E5,0,N.A4,N.C5,0,0],[N.A4,0,N.C5,N.A4,N.G4,0,N.A4,0],[N.G4,N.A4,N.C5,N.D5,N.E5,0,N.D5,0]],
  [[N.G5,0,N.E5,0,N.G5,N.A5,N.G5,0],[N.E5,0,N.C5,0,N.E5,N.D5,N.C5,0],[N.D5,0,N.C5,N.A4,N.C5,0,0,0],[N.D5,0,N.E5,0,N.D5,N.C5,N.D5,0]],
];
const BEAT8 = 60/108/2;
let mGain = null, mTimer = null, mNext = 0, mStep = 0, hatBuf = null;
function mNote(f, t, dur, type, vol, decay=8){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.008); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(mGain); o.start(t); o.stop(t+dur+.02);
}
function mStepPlay(i, t){
  const bar = Math.floor(i/8)%4, st = i%8, sec = Math.floor(i/32)%2, [root, triad] = PROG[bar];
  if(st===0 || st===4) mNote(root*(st===4?1.5:1), t, BEAT8*1.8, "triangle", .22, 6);
  if(st===2 || st===6) triad.forEach(f => mNote(f, t, BEAT8*.8, "triangle", .035));
  const m = MEL[sec][bar][st]; if(m) mNote(m, t, BEAT8*1.4, "sine", .07);
  if(st%2===1){ const s = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
    s.buffer = hatBuf; f.type="highpass"; f.frequency.value = 6000; g.gain.value = .05; s.connect(f).connect(g).connect(mGain); s.start(t); }
}
function startMusic(){
  if(mTimer || !actx) return;
  if(!hatBuf){ const n = Math.floor(actx.sampleRate*.03); hatBuf = actx.createBuffer(1, n, actx.sampleRate); const d = hatBuf.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n); }
  mGain = actx.createGain(); mGain.gain.setValueAtTime(0, actx.currentTime); mGain.gain.linearRampToValueAtTime(.45, actx.currentTime+1.2); mGain.connect(actx.destination);
  mNext = actx.currentTime + .08; mStep = 0;
  mTimer = setInterval(() => { while(mNext < actx.currentTime + .15){ mStepPlay(mStep, mNext); mNext += BEAT8; mStep++; } }, 30);
}
function stopMusic(){
  if(!mTimer) return; clearInterval(mTimer); mTimer = null;
  const g = mGain; g.gain.setTargetAtTime(0, actx.currentTime, .08); setTimeout(() => { try{ g.disconnect(); }catch(e){} }, 600);
}
function tone(freq, dur=.12, type="sine", vol=.12, slide=0, delay=0){
  if(!soundOn||!actx) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur=.08, vol=.06, hp=1800){
  if(!soundOn||!actx) return;
  const len = Math.floor(actx.sampleRate*dur), b = actx.createBuffer(1,len,actx.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer=b; f.type="highpass"; f.frequency.value=hp; g.gain.value=vol; s.connect(f).connect(g).connect(actx.destination); s.start();
}
const sfx = {
  scrub(){ noise(.06,.05,2400); }, plunge(){ tone(140,.12,"triangle",.14,-60); },
  plop(){ tone(520,.18,"sine",.18,-420); tone(900,.1,"sine",.08,300,.12); },
  coin(){ tone(880,.08,"square",.05); tone(1320,.14,"square",.05,0,.07); },
  sparkle(){ tone(1600,.1,"sine",.07); tone(2100,.12,"sine",.06,0,.06); },
  angry(){ tone(160,.25,"sawtooth",.06,-40); }, bark(){ tone(380+Math.random()*200,.07,"square",.035); },
  slip(){ tone(700,.3,"sine",.1,-550); }, pick(){ tone(600,.06,"triangle",.08); tone(800,.06,"triangle",.08,0,.06); },
  flush(){ noise(.5,.04,600); }, click(){ tone(900,.04,"triangle",.05); },
  train(){ noise(1.6,.05,180); tone(70,1.4,"sawtooth",.035,-20); },
  chime(){ tone(784,.35,"sine",.08); tone(622,.5,"sine",.08,0,.32); },
};

// ---------- projection ----------
const K = 0.6;
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const dist = (a,b,c,d) => Math.hypot(a-c, b-d);
const P = (x,y,z=0) => [(x-y)*K, (x+y)*K*.5 - z*K];
const cam = {x:0, y:0, z:1, fit:1};
let VW = 0, VH = 0, DPR = 1;
function toWorld(sx, sy){ const ix=(sx-cam.x)/cam.z, iy=(sy-cam.y)/cam.z, a=ix/K, b=2*iy/K; return {x:(a+b)/2, y:(b-a)/2}; }
function toScreen(x,y,z=0){ const p = P(x,y,z); return [p[0]*cam.z+cam.x, p[1]*cam.z+cam.y]; }
const floorT = () => ctx.transform(K, K*.5, -K, K*.5, 0, 0);
function poly(pts, fill, stroke, lw=1.2){ ctx.beginPath(); pts.forEach((p,i)=>{ const q=P(p[0],p[1],p[2]||0); i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); }); ctx.closePath(); if(fill){ctx.fillStyle=fill; ctx.fill();} if(stroke){ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke();} }
function box(x,y,z,w,d,h,top,left,right,stroke="rgba(59,50,38,.5)"){
  poly([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]], left, stroke);
  poly([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]], right, stroke);
  poly([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]], top, stroke);
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }

const ROOM = {w:900, h:560};
const STALL_X0 = 170, STALL_W = 124, STALL_GAP = 6, STALL_D = 150;
const DOOR = {x:75, y:562};
const CART = {x:420, y:440, w:84, h:44};
const SIDEWALK_Y = 640;

let G = null;
const upLv = id => save.up[id]||0;
function stats(){ return {
  mop: .8*(1+.35*upLv("paspas")), scrub: .75*(1+.35*upLv("paspas")), plunge: .5*(1+.4*upLv("pompa")),
  carry: 3+2*upLv("kova"), speed: 190*(1+.15*upLv("ayakkabi")), patience: 1+.25*upLv("koku"), stalls: 3+upLv("kabin") }; }
const makeSpots = n => Array.from({length:n}, () => ({x:rand(-40,40), y:rand(-10,55), r:rand(5,12), c:pick([C.plum,C.rot,C.brown])}));
function newDay(){
  const S = stats();
  const stalls = [0,1,2,3].map(i => { const x = STALL_X0 + i*(STALL_W+STALL_GAP);
    return {i, x, w:STALL_W, cx:x+STALL_W/2, cy:42, fx:x+STALL_W/2, fy:178, locked:i>=S.stalls, dirt:0, clog:false, paper:3, occ:null, res:null, spots:makeSpots(9), doorT:0}; });
  const sinks = [0,1].map(i => ({i, x:770+i*86, fx:770+i*86, fy:84, dirt:0, soap:4, occ:null, res:null, spots:makeSpots(5)}));
  G = { t:0, dayLen:150, closing:false, S, stalls, sinks, puddles:[], customers:[], queue:[], particles:[], floats:[],
    player:{x:470, y:360, dir:1, carry:0, work:null, target:null, walk:null, bob:0, mopping:false, nagT:0},
    spawnT:2, train:newTrain(), trickleT:rand(8,14), served:0, angry:0, slips:0, revenue:0, satSum:0, satN:0, shake:0, speed:1, marker:null };
}
const decor = {
  trees:[[1040,90],[1130,300],[1050,500],[-150,-110],[260,-150],[640,-170],[-160,260],[1180,120],[-120,980],[260,1000],[660,985],[1060,995],[1420,980]],
  planters:[[300,604],[620,604],[880,604]],
  lamps:[[200,684],[820,684],[1300,684]],
  benches:[[1000,560]],
};

// ---------- input ----------
const keys = new Set();
addEventListener("keydown", e => {
  if(modalOpen()){ if(e.code==="Escape" && modalClosable) closeModal(); return; }
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key) || e.code==="Space") e.preventDefault();
  keys.add(e.code); audio();
  if(e.code==="Space" && document.activeElement && document.activeElement!==document.body) document.activeElement.blur();
  if(e.code==="KeyP" && state==="play") setSpeed(G.speed===0?1:0);
});
addEventListener("keyup", e => keys.delete(e.code));
addEventListener("blur", () => keys.clear());

const pointers = new Map(); let panStart = null, pinchStart = null, moved = false;
cv.addEventListener("pointerdown", e => {
  audio(); try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  moved = false;
  if(pointers.size===1) panStart = {x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y};
  if(pointers.size===2){ const [a,b] = [...pointers.values()]; pinchStart = {d:dist(a.x,a.y,b.x,b.y), z:cam.z, mx:(a.x+b.x)/2, my:(a.y+b.y)/2}; }
});
cv.addEventListener("pointermove", e => {
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===2 && pinchStart){ const [a,b] = [...pointers.values()]; zoomAt(pinchStart.mx, pinchStart.my, pinchStart.z*dist(a.x,a.y,b.x,b.y)/pinchStart.d); moved = true; return; }
  if(panStart){ const dx=e.clientX-panStart.x, dy=e.clientY-panStart.y;
    if(moved || Math.hypot(dx,dy)>8){ moved = true; cv.classList.add("panning"); cam.x = panStart.cx+dx; cam.y = panStart.cy+dy; clampCam(); followHold = 3; } }
});
function endPointer(e){
  if(!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId); cv.classList.remove("panning");
  if(pointers.size<2) pinchStart = null;
  if(pointers.size===0){ if(!moved) tap(e.clientX, e.clientY); panStart = null; }
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", e => { pointers.delete(e.pointerId); panStart=null; pinchStart=null; cv.classList.remove("panning"); });
cv.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, cam.z*(e.deltaY<0 ? 1.12 : 1/1.12)); }, {passive:false});
function zoomAt(sx, sy, nz){
  nz = clamp(nz, cam.fit*.75, cam.fit*2.4);
  const w = {x:(sx-cam.x)/cam.z, y:(sy-cam.y)/cam.z};
  cam.z = nz; cam.x = sx-w.x*nz; cam.y = sy-w.y*nz; clampCam(); if(pointers.size || panStart) followHold = 3;
}
function clampCam(){
  const c = P(450, 300), sx = c[0]*cam.z+cam.x, sy = c[1]*cam.z+cam.y;
  if(sx < VW*.1) cam.x += VW*.1-sx; if(sx > VW*.9) cam.x -= sx-VW*.9;
  if(sy < VH*.1) cam.y += VH*.1-sy; if(sy > VH*.9) cam.y -= sy-VH*.9;
}
// the cart sprite is taller than its floor footprint: test the drawn picture's box on screen
function cartRect(){ const c = P(CART.x+CART.w/2, CART.y+CART.h/2), w = 112, h = CART_IMG.naturalWidth ? w*CART_IMG.naturalHeight/CART_IMG.naturalWidth : 120; return {x:c[0]-w/2, y:c[1]+24-h, w, h}; }
function cartHit(sx, sy){ const r = cartRect(), x0 = r.x*cam.z+cam.x, y0 = r.y*cam.z+cam.y, pad = 4; return sx >= x0+r.w*cam.z*.06-pad && sx <= x0+r.w*cam.z*.94+pad && sy >= y0+r.h*cam.z*.04-pad && sy <= y0+r.h*cam.z+pad; }
function tap(sx, sy){
  if(state!=="play" || G.speed===0) return;
  const w = toWorld(sx, sy), pl = G.player, t = spriteHit(sx, sy) || targetAt(w.x, w.y);
  followHold = 0;
  if(t) sendTo(t);
  else if(w.x>-10 && w.x<ROOM.w+10 && w.y>-10 && w.y<ROOM.h){ pl.target=null; pl.via=null; pl.walk={x:w.x, y:w.y}; pl.work=null; G.marker={x:w.x,y:w.y,t:.6}; sfx.click(); }
}
function sendTo(t){ const pl = G.player; pl.target=t; pl.walk={x:t.fx, y:t.fy}; pl.via=null; pl.work=null;
  // the cart blocks the way from behind: walk round its west end to the front
  if(t.kind==="cart" && pl.y < CART.y+CART.h && pl.x > CART.x-24){ pl.walk = {x:CART.x-30, y:clamp(pl.y, CART.y-20, CART.y+CART.h/2)}; pl.via = [{x:CART.x-30, y:CART.y+CART.h+14}, {x:t.fx, y:t.fy}]; } G.marker={x:t.fx,y:t.fy,t:.6}; sfx.click(); }
const stallTarget = s => ({kind:"stall", ref:s, fx:s.fx, fy:s.fy});
const sinkTarget = k => ({kind:"sink", ref:k, fx:k.fx, fy:k.fy});
const cartTarget = () => ({kind:"cart", ref:CART, fx:CART.x+4, fy:CART.y+CART.h+22});
function targetAt(x,y){
  for(const s of G.stalls) if(!s.locked && x>s.x && x<s.x+s.w && y>-90 && y<200) return stallTarget(s);
  for(const k of G.sinks) if(x>k.x-42 && x<k.x+42 && y>-90 && y<110) return sinkTarget(k);
  if(x>CART.x-30 && x<CART.x+CART.w+20 && y>CART.y-50 && y<CART.y+CART.h+20) return cartTarget();
  return null;
}
function nearestTarget(px,py){
  const c = [cartTarget()]; G.stalls.forEach(s=>{ if(!s.locked) c.push(stallTarget(s)); }); G.sinks.forEach(k=>c.push(sinkTarget(k)));
  let best=null, bd=60; for(const t of c){ const d=dist(px,py,t.fx,t.fy); if(d<bd){bd=d;best=t;} } return best;
}
function jobFor(t){
  const pl = G.player;
  if(t.kind==="cart") return pl.carry < G.S.carry ? {type:"pick", time:.5} : {type:"full"};
  const r = t.ref; if(r.occ) return {type:"busy"};
  if(t.kind==="stall"){
    if(r.clog) return {type:"plunge", time:1/G.S.plunge};
    if(r.dirt>.02) return {type:"scrub", time:1};
    if(r.paper<3) return pl.carry>0 ? {type:"refill", time:.35} : {type:"needstock"};
    return {type:"done"};
  }
  if(r.dirt>.02) return {type:"scrub", time:1};
  if(r.soap<4) return pl.carry>0 ? {type:"refill", time:.35} : {type:"needstock"};
  return {type:"done"};
}

// ---------- customers ----------
const availableTypes = () => Object.keys(TYPES).filter(k => TYPES[k].day <= save.day);
function spawnCustomer(from){
  const pool = availableTypes(), w = pool.map(k => k==="normal"?3 : k==="vip"?1 : k==="pis"?.8 : 1.6);
  let r = Math.random()*w.reduce((a,b)=>a+b,0), type = pool[0];
  for(let i=0;i<pool.length;i++){ r-=w[i]; if(r<=0){ type=pool[i]; break; } }
  if(type==="pis" && G.customers.some(c=>c.type==="pis")) type = "normal";   // one muddy guest at a time
  const T = TYPES[type], side = Math.random()<.5 ? -1 : 1, pat = T.patience*G.S.patience;
  const o = from || (side<0 ? {x:ST.x0+10, y:580+rand(-20,20), esc:true} : {x:1320, y:620+rand(-20,20)});
  const path = o.esc ? [{x:ST.x0+70, y:o.y}] : o.y>=690 ? [{x:o.x, y:650+rand(-10,10)}] : [];
  path.push({x:DOOR.x+rand(-10,10), y:612+rand(-8,8)}, {x:DOOR.x, y:548});
  G.customers.push({id:Math.random(), type, T, x:o.x, y:o.y, state:"arrive", path,
    patience:pat, maxPat:pat, stall:null, sink:null, timer:0, sat:100, bubble:null, slip:0, wob:rand(0,6), trailT:rand(4,7), trailLeft:1, waitSink:0, face:1});
}
const queueSpot = i => ({x:52 + (i%2?18:0), y:205 + i*40});
function moveTo(c, x, y, dt, mul=1){
  const dx=x-c.x, dy=y-c.y, d=Math.hypot(dx,dy), sp=c.T.speed*mul*(c.slip>0?.2:1)*dt;
  if(Math.abs(dx-dy)>1) c.face = (dx-dy)>0 ? 1 : -1;
  if(d<=sp){ c.x=x; c.y=y; return true; } c.x+=dx/d*sp; c.y+=dy/d*sp; return false;
}
function followPath(c, dt, mul=1){ while(c.path.length){ if(moveTo(c, c.path[0].x, c.path[0].y, dt, mul)) c.path.shift(); else return false; } return true; }
function leavePath(c, from){
  const p = [];
  if(from==="sink" || c.y<190) p.push({x:Math.min(c.x,720), y:205});
  p.push({x:DOOR.x+20, y:520}, {x:DOOR.x, y:575}, {x:DOOR.x, y:620+rand(-10,10)});
  if(Math.random()<.6){ const y = 580+rand(-30,40); p.push({x:ST.x0+70, y}, {x:ST.x0+4, y}); }
  else p.push({x:900, y:640+rand(-12,12)}, {x:1340, y:620+rand(-20,20)});
  c.path = p;
}
function releaseRes(c){
  G.queue = G.queue.filter(q=>q!==c);
  if(c.stall){ if(c.stall.res===c) c.stall.res=null; if(c.stall.occ===c) c.stall.occ=null; c.stall=null; }
  if(c.sink){ if(c.sink.res===c) c.sink.res=null; if(c.sink.occ===c) c.sink.occ=null; c.sink=null; }
}
function leaveAngry(c, msg){
  c.angry=true; G.angry++; G.satN++; c.sat=0; say(c, msg, 2.2); sfx.angry();
  floatText(c.x, c.y, 60, "Kızgın!", C.bad, true); { const sc = toScreen(c.x, c.y, 40); badFx(sc[0], sc[1]); } releaseRes(c); leavePath(c); c.state="leave";
}
function finishVisit(c){
  const fee = c.T.fee, sat = clamp(c.sat,0,100), tip = sat>70 ? Math.round((sat-70)/30*5) : 0;
  const pay = sat<25 ? Math.ceil(fee/2) : fee+tip;
  save.money += pay; G.revenue += pay; G.served++; if(sat>=60) G.happy = (G.happy||0) + 1; G.satSum += sat; G.satN++;
  floatText(c.x, c.y, 60, "+₺"+pay, sat>=60?C.good:C.orange, true); sfx.coin(); { const sc = toScreen(c.x, c.y, 50); payFx(sc[0], sc[1], pay); }
  if(sat>=90 && Math.random()<.6) say(c, pick(["Pırıl pırıl!","5 yıldız veriyorum.","Burası bir sanat eseri."]));
  else if(sat<40) say(c, pick(["Bir daha mı? Asla.","Yorum yazacağım, haberin olsun.","Hijyen nerede hijyen?"]));
  leavePath(c, "sink"); c.state="leave";
}
function addPuddle(x,y,amt,kind){
  x = clamp(x, 25, ROOM.w-25); y = clamp(y, x>700 ? 100 : 195, ROOM.h-20);
  if(x>CART.x-20 && x<CART.x+CART.w+20 && y>CART.y-10 && y<CART.y+CART.h+10) y = CART.y+CART.h+24;
  for(const p of G.puddles) if(dist(x,y,p.x,p.y)<34){ p.amt=clamp(p.amt+amt*.5,0,1.6); return; }
  G.puddles.push({x,y,amt,r:rand(26,36),pts:Array.from({length:9},()=>rand(.72,1.15)),kind,rot:rand(0,6)});
}
const inside = c => c.x>0 && c.x<ROOM.w && c.y>0 && c.y<ROOM.h;
function updateCustomer(c, dt){
  if(c.bubble){ c.bubble.t-=dt; if(c.bubble.t<=0) c.bubble=null; }
  if(c.slip>0) c.slip-=dt;
  c.wob += dt*9;
  const walking = c.state!=="inStall" && c.state!=="atSink";
  const moving = c.state==="arrive" || c.state==="toStall" || c.state==="toSink" || c.state==="leave";
  if(c.T.trail && moving && c.trailLeft>0 && inside(c)){ c.trailT-=dt; if(c.trailT<=0){ c.trailT=rand(9,13); c.trailLeft--; addPuddle(c.x+rand(-6,6), c.y+6, rand(.5,.8), "mud"); } }
  if(c.slip<=0 && walking && inside(c)){
    for(const p of G.puddles) if(p.amt>.3 && dist(c.x,c.y,p.x,p.y)<p.r*.75 && Math.random()<dt*1.1){
      c.slip=1; c.sat-=12; G.slips++; sfx.slip(); say(c, pick(["Woooah!","Kim yaptı bunu?!","Belim, belim!"]),1.6); floatText(c.x,c.y,70,"Kaydı!",C.plum); break; }
  }
  switch(c.state){
    case "arrive":
      if(followPath(c, dt)){ c.state="queue"; G.queue.push(c); if(Math.random()<.5) say(c, pick(c.T.barks)); }
      break;
    case "queue": {
      const idx = G.queue.indexOf(c), sp = queueSpot(Math.min(idx,8));
      moveTo(c, sp.x, sp.y, dt); c.patience -= dt;
      if(c.patience < c.maxPat*.35 && !c.warned){ c.warned=true; say(c, c.type==="acele" ? "DAHA NE KADAR?!" : pick(["Sıra ilerlemiyor mu?","Hadi ama...","Dayanamıyorum!"])); }
      if(c.patience<=0){ leaveAngry(c, pick(["Ben gidiyorum!","Burası rezalet!","Kafeye giriyorum o zaman!"])); return; }
      if(idx===0){
        const free = G.stalls.filter(s => !s.locked && !s.occ && !s.res && !s.clog && (!c.T.picky || s.dirt<.25));
        if(free.length){
          free.sort((a,b)=>(a.dirt-b.dirt) || (dist(c.x,c.y,a.fx,a.fy)-dist(c.x,c.y,b.fx,b.fy)));
          const s = free[0]; s.res=c; c.stall=s; c.state="toStall"; c.leg=0; G.queue.shift();
          c.sat -= clamp((c.maxPat-c.patience)/c.maxPat*30, 0, 30);
        } else if(c.T.picky && !c.pickyMsg && G.stalls.some(s=>!s.locked&&!s.occ&&!s.res&&!s.clog)){ c.pickyMsg=true; say(c,"Lekeli kabine girmem. Bekliyorum."); }
      }
      break;
    }
    case "toStall": {
      const s = c.stall;
      if(s.clog){ s.res=null; c.stall=null; c.state="queue"; G.queue.unshift(c); break; }
      if(c.leg===0){ if(moveTo(c, s.fx, s.fy, dt)) c.leg=1; }
      else if(moveTo(c, s.cx, 92, dt)){
        s.res=null; s.occ=c; c.state="inStall"; c.timer=rand(c.T.use[0], c.T.use[1]);
        if(s.dirt>.15){ c.sat -= s.dirt*(c.T.picky?70:40); if(s.dirt>.5) say(c, pick(["Iyy, bu ne?","Burası savaş alanı...","Gözlerimi kapatacağım."])); }
        if(c.type==="telefon") say(c, pick(TYPES.telefon.barks), 3);
      }
      break;
    }
    case "inStall": {
      const s = c.stall; c.timer -= dt;
      if(c.type==="telefon" && Math.random()<dt*.25) say(c, pick(TYPES.telefon.barks), 2.6);
      if(c.timer<=0){
        if(s.paper>0) s.paper--; else { c.sat-=35; say(c, pick(["KAĞIT YOK MU YA?!","Peçeteyle mi idare edeyim?","Bu ne çile..."]), 2.6); sfx.angry(); }
        if(s.dirt<=0) s.spots = makeSpots(9);
        s.dirt = clamp(s.dirt + c.T.dirt*rand(.7,1.2), 0, 1);
        if(Math.random()<c.T.clog){ s.clog=true; say(c, pick(["Ehm... sifon bir tuhaf.","Ben bir şey yapmadım.","Su yükseliyor mu o?"]), 2.6); burst(s.cx,s.cy+10,20,6,C.water,50); }
        else sfx.flush();
        if(c.type==="pis" && Math.random()<.4) addPuddle(s.fx+rand(-20,20), s.fy+rand(20,40), 1, "mud");
        if(Math.random()<.25) addPuddle(s.fx+rand(-30,30), s.fy+rand(20,45), rand(.6,1), "water");
        s.occ=null; c.stall=null; c.state="toSink"; c.waitSink=0; c.y=s.fy; c.x=s.fx; c.path=[{x:720,y:200}];
      }
      break;
    }
    case "toSink": {
      if(!c.sink){
        const free = G.sinks.filter(k=>!k.occ && !k.res);
        if(free.length){ free.sort((a,b)=>a.dirt-b.dirt); c.sink=free[0]; c.sink.res=c; }
        else { c.waitSink+=dt; if(followPath(c,dt)) moveTo(c, 690+((c.id*100)%40), 230, dt*.5); if(c.waitSink>6){ c.sat-=10; say(c,"Elimi yıkamadan mı çıkacağım?!"); finishVisit(c); } break; }
      }
      if(followPath(c, dt) && moveTo(c, c.sink.fx, c.sink.fy-12, dt)){ c.sink.res=null; c.sink.occ=c; c.state="atSink"; c.timer=2.2; }
      break;
    }
    case "atSink": {
      const k = c.sink; c.timer -= dt;
      if(Math.random()<dt*8) G.particles.push({x:k.x+rand(-8,8), y:22, z:50, vx:0, vy:rand(-5,5), vz:rand(-20,10), g:true, life:.4, max:.4, size:2.5, col:C.water});
      if(c.timer<=0){
        if(k.soap>0) k.soap--; else { c.sat-=15; say(c,"Sabun da mı yok?"); }
        if(k.dirt>.3) c.sat -= k.dirt*20;
        if(k.dirt<=0) k.spots = makeSpots(5);
        k.dirt = clamp(k.dirt + rand(.06,.16)*(c.type==="pis"?2.2:1), 0, 1);
        if(Math.random()<.2) addPuddle(k.fx+rand(-25,25), k.fy+rand(20,45), .7, "water");
        k.occ=null; c.sink=null; finishVisit(c);
      }
      break;
    }
    case "leave":
      if(followPath(c, dt, c.angry?1.5:1)) c.dead = true;
      break;
  }
}

// ---------- player ----------
function updatePlayer(dt){
  const pl = G.player, S = G.S;
  let sx=0, sy=0;
  if(keys.has("KeyA")||keys.has("ArrowLeft")) sx--;
  if(keys.has("KeyD")||keys.has("ArrowRight")) sx++;
  if(keys.has("KeyW")||keys.has("ArrowUp")) sy--;
  if(keys.has("KeyS")||keys.has("ArrowDown")) sy++;
  const holding = keys.has("Space")||keys.has("KeyE");
  let mx = sx + sy, my = -sx + sy;   // screen direction -> ground direction
  if(sx||sy){ pl.walk=null; pl.target=null; pl.via=null; }
  else if(pl.walk){ const dx=pl.walk.x-pl.x, dy=pl.walk.y-pl.y, d=Math.hypot(dx,dy); if(d<6) pl.walk = pl.via && pl.via.length ? pl.via.shift() : null; else { mx=dx; my=dy; } }
  const ml = Math.hypot(mx,my), spd = pl.work ? 0 : S.speed*(pl.mopping?.75:1);
  if(ml>0 && spd>0){ pl.x+=mx/ml*spd*dt; pl.y+=my/ml*spd*dt; pl.bob+=dt*14; if(Math.abs(mx-my)>.01) pl.dir = (mx-my)>0?1:-1; }
  const sx1 = STALL_X0-12, sx2 = STALL_X0 + 4*(STALL_W+STALL_GAP)+8;
  pl.x = clamp(pl.x, 18, ROOM.w-18);
  pl.y = clamp(pl.y, (pl.x>sx1 && pl.x<sx2) ? 170 : pl.x>=sx2 ? 82 : 22, ROOM.h-16);
  const cx=clamp(pl.x,CART.x,CART.x+CART.w), cy=clamp(pl.y,CART.y,CART.y+CART.h), cd=dist(pl.x,pl.y,cx,cy);
  if(cd<16){ if(cd===0) pl.y=CART.y-17; else { pl.x=cx+(pl.x-cx)/cd*16; pl.y=cy+(pl.y-cy)/cd*16; } }
  for(const [ox,oy,orad] of [[250,530,20],[868,528,24]]){ const d = dist(pl.x,pl.y,ox,oy); if(d<orad && d>0){ pl.x = ox+(pl.x-ox)/d*orad; pl.y = oy+(pl.y-oy)/d*orad; } }

  pl.mopping = false;
  for(const p of G.puddles) if(dist(pl.x,pl.y,p.x,p.y) < p.r+12){
    p.amt -= S.mop*dt; pl.mopping = true;
    if(Math.random()<dt*14) bubbles(p.x,p.y,2);
    if(Math.random()<dt*9) sfx.scrub();
    if(p.amt<=0){ sparkle(p.x,p.y); sfx.sparkle(); if(G.tut && G.tut.step===3) tutNext(); }
  }
  G.puddles = G.puddles.filter(p=>p.amt>0);

  let t = null;
  if(pl.target && !pl.walk) t = pl.target; else if(holding) t = nearestTarget(pl.x, pl.y);
  if(t && dist(pl.x,pl.y,t.fx,t.fy) > 62) t = null;
  if(!t){ pl.work=null; return; }
  const job = jobFor(t);
  if(!job.time){
    const msg = {needstock:"Önce arabadan stok al", busy:"İçeride biri var", full:"Sepet dolu", done:"Tertemiz"}[job.type];
    if(pl.target && !pl.walk){ if(msg) floatText(t.fx, t.fy, 70, msg, job.type==="done"?C.good:C.plum); pl.target=null; }
    else if(holding && job.type==="needstock" && pl.nagT<=0){ floatText(t.fx,t.fy,70,msg,C.plum); pl.nagT=1.2; }
    pl.work=null; return;
  }
  if(!pl.work || pl.work.ref!==t.ref || pl.work.type!==job.type) pl.work = {ref:t.ref, kind:t.kind, type:job.type, t:0, total:job.time, x:t.fx, y:t.fy, start:t.ref.dirt||0};
  const w = pl.work, r = t.ref; w.t += dt;
  const fxX = t.kind==="stall" ? r.cx : r.x, fxY = t.kind==="stall" ? 50 : 26, fxZ = t.kind==="stall" ? 22 : 50;
  if(w.type==="scrub"){
    r.dirt = clamp(r.dirt - S.scrub*dt, 0, 1);
    if(Math.random()<dt*10) sfx.scrub();
    if(Math.random()<dt*16) bubbles(fxX, fxY, fxZ, 1);
    if(r.dirt<=.02){ r.dirt=0; sparkle(fxX, fxY, fxZ); sfx.sparkle(); floatText(w.x, w.y, 80, "Parlıyor!", C.good); pl.work=null; pl.target=null; }
  } else if(w.type==="plunge"){
    if(Math.floor(w.t*5)!==Math.floor((w.t-dt)*5)){ sfx.plunge(); burst(r.cx, 50, 20, 3, C.water, 40, .4, 4); }
    if(w.t>=w.total){ r.clog=false; sfx.plop(); G.shake=.25; burst(r.cx,50,22,14,C.water,110,.7,5); floatText(r.cx, 60, 70, "PLOP!", C.orange, true); pl.work=null; }
  } else if(w.type==="refill"){
    if(w.t>=w.total){ if(t.kind==="stall") r.paper++; else r.soap=Math.min(4,r.soap+2); pl.carry--; sfx.pick(); floatText(w.x,w.y,70, t.kind==="stall"?"+1 rulo":"+sabun", C.ink); pl.work=null; if(G.tut && G.tut.step===2) tutNext(); }
  } else if(w.type==="pick"){
    if(w.t>=w.total){ pl.carry=S.carry; sfx.pick(); floatText(w.x,w.y,60,"Sepet "+pl.carry+"/"+S.carry, C.ink); pl.work=null; pl.target=null; if(G.tut && G.tut.step===1) tutNext(); }
  }
}

function update(dt){
  G.t += dt;
  autoT += dt; if(autoT > 4){ autoT = 0; autosave(); }
  { let m = 1; for(const c of G.customers) if(c.state==="queue" && c.maxPat) m = Math.min(m, c.patience/c.maxPat); tension(m, dt); }
  if(G.player.nagT>0) G.player.nagT -= dt;
  if(G.marker){ G.marker.t -= dt; if(G.marker.t<=0) G.marker=null; }
  const prog = clamp(G.t/G.dayLen, 0, 1);
  if(G.t>=G.dayLen && !G.closing){ G.closing=true; floatText(450, 300, 120, "Kapanış saati!", C.coral, true); }
  updateTrain(dt);
  if(!G.closing && !G.noWave){ G.trickleT -= dt; if(G.trickleT<=0){
    G.trickleT = Math.max(16, 26 - save.day)*rand(.8,1.2);
    if(G.queue.length < 4 && G.customers.length < 9) spawnCustomer(); } }
  updatePlayer(dt);
  G.customers.forEach(c => updateCustomer(c, dt));
  G.customers = G.customers.filter(c=>!c.dead);
  for(const s of G.stalls) s.doorT += ((s.occ?1:0)-s.doorT)*Math.min(1,dt*10);
  for(const p of G.particles){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; if(p.g){ p.vz-=420*dt; if(p.z<0){p.z=0;p.vz=0;p.vx*=.5;p.vy*=.5;} } }
  G.particles = G.particles.filter(p=>p.life>0);
  for(const f of G.floats){ f.life-=dt; f.rise+=30*dt; }
  G.floats = G.floats.filter(f=>f.life>0);
  if(G.shake>0) G.shake-=dt;
  if(G.closing && (G.customers.length===0 || G.t>G.dayLen+25)) endDay();
}

// ---------- drawing ----------
function blob(x,y,r,pts,rot){
  ctx.beginPath(); const n=pts.length;
  for(let i=0;i<=n;i++){ const a=rot+i/n*Math.PI*2, R=r*pts[i%n], px=x+Math.cos(a)*R, py=y+Math.sin(a)*R;
    if(i===0) ctx.moveTo(px,py); else { const pa=rot+(i-.5)/n*Math.PI*2, pr=r*(pts[i%n]+pts[(i-1)%n])/2*1.08; ctx.quadraticCurveTo(x+Math.cos(pa)*pr, y+Math.sin(pa)*pr, px, py); } }
  ctx.closePath();
}

  ctx.save(); ctx.translate(16, 380); ctx.rotate(-Math.PI/2); ctx.fillStyle="rgba(196,138,23,.9)"; ctx.font="900 20px Nunito, sans-serif"; ctx.textAlign="center"; ctx.fillText("SIRA BURADA", 0, 0); ctx.restore();
  rr(DOOR.x-38, 548, 76, 50, 8); ctx.fillStyle=C.coral; ctx.fill();
  ctx.fillStyle="#fff3e6"; ctx.font="900 15px Nunito, sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("GİRİŞ", DOOR.x, 574);
  ctx.globalAlpha=.16; ctx.fillStyle=C.ink; ctx.font="700 46px DynaPuff, Nunito, sans-serif"; ctx.fillText("FLUSH RUSH", 650, 370); ctx.globalAlpha=1;
  for(const p of G.puddles){

function drawCart(){
  shadow(CART.x+CART.w/2, CART.y+CART.h/2, 46, 18);

    const c = P(CART.x+CART.w/2, CART.y+CART.h/2), w = 112, h = w*CART_IMG.naturalHeight/CART_IMG.naturalWidth;

}
function stink(x,y,z,amt){
  const t = performance.now()/500, b = P(x,y,z);
  ctx.save(); ctx.globalAlpha=.35+amt*.4; ctx.strokeStyle=C.rot; ctx.lineWidth=2.6; ctx.lineCap="round";
  for(let i=-1;i<=1;i++){ ctx.beginPath(); for(let k=0;k<=12;k++){ const py=b[1]-k*3.6, px=b[0]+i*12+Math.sin(t+k*.6+i)*4; k?ctx.lineTo(px,py):ctx.moveTo(px,py); } ctx.stroke(); }
  ctx.fillStyle=C.ink; for(let i=0;i<Math.ceil(amt*3);i++){ const a=t*3+i*2.1; ctx.beginPath(); ctx.arc(b[0]+Math.cos(a)*18, b[1]-26+Math.sin(a*1.7)*8, 1.8, 0, 6.3); ctx.fill(); }
  ctx.restore();
}

const CAR_L = 300, CAR_GAP = 14, NCARS = 3, TRAIN_Y = 714, TRAIN_D = 58, TRAIN_STOP_X = -100;
const TRAIN_ARR = 3.4, TRAIN_STOP = 6.5, TRAIN_DEP = 3.2;
const ANNOUNCE = ["Yenikapı. Kapılar sağ taraftan açılacaktır.","Lütfen kapılardan uzak durunuz.","Tuvalete koşan yolcularımıza başarılar dileriz.","Sayın yolcularımız, peronda koşmayınız.","Bir sonraki istasyon: tuvalet sırası."];
function trainPeriod(){ return Math.max(24, 32 - save.day*1.5); }
function newTrain(){ return {phase:"away", t:0, wait:5, x:null, spawnQ:[]}; }
function trainDoors(){ const tr=G.train, d=[]; for(let i=0;i<NCARS;i++){ const cx = tr.x + i*(CAR_L+CAR_GAP); d.push(cx+75, cx+225); } return d; }
function trainCountdown(){
  const tr = G.train; if(!tr) return null;
  if(tr.phase==="away") return Math.max(0, tr.wait - tr.t);
  return 0;
}
function updateTrain(dt){
  const tr = G.train; tr.t += dt;
  if(tr.phase==="away"){
    if(tr.t >= tr.wait && !G.closing){ tr.phase="arr"; tr.t=0; tr.x=ST.x1; sfx.train(); sfx.chime(); announce(pick(ANNOUNCE)); }
  } else if(tr.phase==="arr"){
    const u = clamp(tr.t/TRAIN_ARR,0,1); tr.x = TRAIN_STOP_X + (ST.x1-TRAIN_STOP_X)*Math.pow(1-u,2.2);
    if(u>=1){ tr.phase="stop"; tr.t=0; tr.x=TRAIN_STOP_X; queueWave(); }
  } else if(tr.phase==="stop"){
    if(tr.t >= TRAIN_STOP){ tr.phase="dep"; tr.t=0; sfx.train(); }
  } else if(tr.phase==="dep"){
    const u = clamp(tr.t/TRAIN_DEP,0,1); tr.x = TRAIN_STOP_X - Math.pow(u,2)*2600;
    if(u>=1){ tr.phase="away"; tr.t=0; tr.x=null; tr.wait = Math.max(4, trainPeriod() - TRAIN_ARR - TRAIN_STOP - TRAIN_DEP)*rand(.85,1.15); }
  }
  for(const s of tr.spawnQ){ s.t -= dt; if(s.t<=0 && !s.done){ s.done = true; if(G.queue.length < 5 && G.customers.length < 10) spawnCustomer({x:s.x, y:700}); } }
  tr.spawnQ = tr.spawnQ.filter(s=>!s.done);
}
function queueWave(){
  if(G.noWave || G.closing) return;
  const n = Math.min(5, 2 + Math.floor(save.day/2)), doors = trainDoors().filter(x => x>-60 && x<960);
  for(let i=0;i<n;i++) G.train.spawnQ.push({t:.7 + i*.45, x:pick(doors)+rand(-8,8)});
}

function drawFace(L, f, ex, t){

  else if(ex==="shock"){ ctx.fillStyle="#7a2e2e"; ctx.beginPath(); ctx.ellipse(cx,my,2.6,3.2,0,0,6.3); ctx.fill(); }

// pose: {handF:[x,y]|null, handB:[x,y]|null, ex, ph, moving, f, back, spin, extra(fn after torso), tool(fn under arms)}
function drawChar(x, y, L, skin, o){

function drawCustomer(c){
  if(c.state==="inStall") return;

  const L = LOOKS[c.type] || LOOKS.normal, f = c.fc, t = performance.now()/1000;
  let ex = "neutral";
  if(c.slip>0) ex = "shock";
  else if(c.angry || (c.state==="leave" && c.sat<40)) ex = "angry";
  else if(c.state==="queue" && c.patience < c.maxPat*.35) ex = "angry";
  else if(c.type==="acele" && (c.state==="queue"||c.state==="toStall"||c.state==="arrive")) ex = "panic";

const WALK = {cells:4, seq:[0,1,3], fps:6, gx:110/220, gy:312/330, cellH:330, charPx:300};
function drawPlayerSprite(pl){
  const p = P(pl.x, pl.y), t = performance.now()/1000, w = pl.work;
  const h = JAN.h, wd = h*JAN_IMG.naturalWidth/JAN_IMG.naturalHeight, f = pl.fc < 0 ? -1 : 1;
  let lift = 0, rot = 0, sq = 1;
  if(!reduceMotion){
    if(pl.moving){ lift = Math.abs(Math.sin(pl.ph))*3; rot = Math.sin(pl.ph)*.05; }
    else if(w || pl.mopping){ rot = Math.sin(t*16)*.05; sq = 1 + Math.sin(t*16)*.02; }
    else sq = 1 + Math.sin(t*2.2)*.012;   // idle breathing
  }
  shadow(pl.x, pl.y, 15, 7);
  if(WALK_ON && pl.moving && WALK_IMG.complete && WALK_IMG.naturalWidth){
    const cw = WALK_IMG.naturalWidth/WALK.cells, chh = WALK_IMG.naturalHeight, k = h/WALK.charPx*(WALK.cellH/chh)*(chh/WALK.cellH), sc = h/(WALK.charPx*chh/WALK.cellH);
    const fi = WALK.seq[Math.floor(t*WALK.fps) % WALK.seq.length], dw = cw*sc, dh = chh*sc;
    ctx.save(); ctx.translate(p[0], p[1]); ctx.scale(f, 1); ctx.drawImage(WALK_IMG, fi*cw, 0, cw, chh, -WALK.gx*dw, -WALK.gy*dh, dw, dh); ctx.restore();
  } else {
  ctx.save(); ctx.translate(p[0], p[1] - lift); ctx.rotate(rot); ctx.scale(f, sq);
  ctx.drawImage(JAN_IMG, -JAN.ax*wd, -JAN.ay*h, wd, h);
  ctx.restore(); }
  if(w){
    const k = w.type==="scrub" ? 1 - w.ref.dirt/Math.max(.03, w.start) : w.t/w.total;
    rr(p[0]-22, p[1]-h-8, 44, 9, 5); ctx.fillStyle="#fff"; ctx.fill(); ctx.strokeStyle=C.ink; ctx.lineWidth=1.6; ctx.stroke();
    rr(p[0]-20, p[1]-h-6, 40*clamp(k,0,1), 5, 3); ctx.fillStyle=C.orange; ctx.fill();
  }
}
function drawPlayer(){
  const pl = G.player; trackMotion(pl);
  if(JAN_IMG.complete && JAN_IMG.naturalWidth){ drawPlayerSprite(pl); return; }
  const L = LOOKS.player, f = pl.fc, t = performance.now()/1000;
  const w = pl.work, mopping = pl.mopping || (w && w.type==="scrub");
  const o = {f, ph:pl.ph, moving:pl.moving, back:pl.back && !w, ex: w ? "focus" : "happy", seed:1};
  if(w && w.type==="plunge"){
    const pump = Math.abs(Math.sin(w.t*16))*7;
    o.handF = [f*9, -30+pump*.6]; o.handB = [f*4, -27+pump*.6];
    o.toolFront = h => { ctx.strokeStyle="#8a5a3a"; ctx.lineWidth=3.2; ctx.lineCap="round"; ctx.beginPath(); ctx.moveTo(h[0],h[1]-10); ctx.lineTo(h[0]+f*4,h[1]+24); ctx.stroke();
      ctx.fillStyle=C.bad; ctx.strokeStyle=C.ink; ctx.lineWidth=1.8; ctx.beginPath(); ctx.ellipse(h[0]+f*4,h[1]+26,6.5,4,0,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.stroke(); };
  } else {
    const wig = mopping && !reduceMotion ? Math.sin(t*16)*5 : 0;
    o.handF = [f*12 + wig*f*.4, -20]; o.handB = pl.carry ? [-f*12,-22] : null;
    o.toolFront = h => { const ex = h[0]+f*(14+wig), ey = 2;
      ctx.strokeStyle="#9a6a3e"; ctx.lineWidth=3; ctx.lineCap="round"; ctx.beginPath(); ctx.moveTo(h[0]-f*4,h[1]-14); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.fillStyle="#f3e6c4"; ctx.strokeStyle=C.ink; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(ex,ey+1,9,3.6,0,0,6.3); ctx.fill(); ctx.stroke();
      ctx.strokeStyle="rgba(59,50,38,.35)"; ctx.lineWidth=1; for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(ex+i*3,ey-1); ctx.lineTo(ex+i*3.4,ey+3); ctx.stroke(); } };
    if(pl.carry) o.toolBack = h => { ctx.fillStyle="#cfa36a"; ctx.strokeStyle=C.ink; ctx.lineWidth=1.6; rr(h[0]-8,h[1]-2,16,10,3); ctx.fill(); ctx.stroke();
      for(let i=0;i<Math.min(pl.carry,5);i++){ const rx=h[0]-5+(i%3)*5, ry=h[1]-3-Math.floor(i/3)*5; ctx.fillStyle="#fff"; circ(rx,ry,3); ctx.fill(); ctx.stroke(); } };
  }
  drawChar(pl.x, pl.y, L, "#f1c29a", o);
  const p = P(pl.x, pl.y);
  if(w){
    const k = w.type==="scrub" ? 1 - w.ref.dirt/Math.max(.03, w.start) : w.t/w.total;
    rr(p[0]-22, p[1]-78, 44, 9, 5); ctx.fillStyle="#fff"; ctx.fill(); ctx.strokeStyle=C.ink; ctx.lineWidth=1.6; ctx.stroke();
    rr(p[0]-20, p[1]-76, 40*clamp(k,0,1), 5, 3); ctx.fillStyle=C.orange; ctx.fill();
  }
}

function drawParticles(){
  for(const q of G.particles){
    const a = clamp(q.life/q.max,0,1), p = P(q.x,q.y,q.z); ctx.globalAlpha = a;
    if(q.col==="bubble"){ ctx.beginPath(); ctx.arc(p[0],p[1],q.size,0,6.3); ctx.fillStyle="rgba(255,255,255,.75)"; ctx.fill(); ctx.strokeStyle="rgba(110,175,200,.9)"; ctx.lineWidth=1.1; ctx.stroke(); }
    else if(q.col==="star"){ const s=q.size*(.5+a*.5); ctx.beginPath(); for(let i=0;i<8;i++){ const r=i%2?s*.35:s, an=i*Math.PI/4; ctx.lineTo(p[0]+Math.cos(an)*r, p[1]+Math.sin(an)*r); } ctx.closePath(); ctx.fillStyle="#fff6c8"; ctx.fill(); ctx.strokeStyle=C.mustard; ctx.lineWidth=1.1; ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(p[0],p[1],q.size,0,6.3); ctx.fillStyle=q.col; ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
function drawBubble(sx, sy, txt){
  ctx.font="700 13px Nunito, sans-serif"; const w = Math.min(230, ctx.measureText(txt).width+20);
  const bx = clamp(sx-w/2, 6, VW-w-6), by = sy-40;
  ctx.shadowColor="rgba(60,40,20,.18)"; ctx.shadowBlur=10; ctx.shadowOffsetY=3;
  rr(bx,by,w,27,13); ctx.fillStyle="#fff8ec"; ctx.fill(); ctx.shadowColor="transparent";
  ctx.strokeStyle="#e6d6bb"; ctx.lineWidth=1.6; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx-6,by+26); ctx.lineTo(sx,by+34); ctx.lineTo(sx+6,by+26); ctx.fillStyle="#fff8ec"; ctx.fill();
  ctx.fillStyle=C.ink; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(txt, bx+w/2, by+14, w-12);
}
function drawOverlay(){
  for(const c of G.customers){ if(!c.bubble) continue;
    const s = c.state==="inStall" && c.stall ? toScreen(c.stall.cx, STALL_D, 80) : toScreen(c.x, c.y, 82);
    drawBubble(s[0], s[1], c.bubble.txt); }
  for(const f of G.floats){ const s = toScreen(f.x, f.y, f.z), age = 1.4 - f.life, k = clamp(age/.18, 0, 1), sc = 1 + .55*Math.sin(k*Math.PI)*(f.big?1:.6);
    ctx.save(); ctx.translate(s[0], s[1]-f.rise); ctx.scale(sc, sc);
    ctx.globalAlpha = clamp(f.life/.5,0,1); ctx.font = f.big ? "700 20px DynaPuff, Nunito, sans-serif" : "800 14px Nunito, sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.lineWidth=5; ctx.strokeStyle="#fff"; ctx.strokeText(f.txt, 0, 0); ctx.fillStyle=f.col; ctx.fillText(f.txt, 0, 0); ctx.restore(); }
  ctx.globalAlpha = 1;
}
function render(){
  SPR_HITS = [];
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = "#2a2e31"; ctx.fillRect(0,0,VW,VH);
  let ox=0, oy=0; if(G.shake>0 && !reduceMotion){ ox=rand(-5,5)*G.shake*4; oy=rand(-5,5)*G.shake*4; }
  ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z, DPR*(cam.x+ox), DPR*(cam.y+oy));
  drawStationWalls();
  drawGround();
  drawWalls();
  const L = [];
  G.stalls.forEach(s => { L.push({d:s.cx+40, f:()=>drawToilet(s)}); L.push({d:s.cx+STALL_D+1, f:()=>drawDoor(s)}); });
  for(let i=0;i<=4;i++){ const x = STALL_X0 - 3 + i*(STALL_W+STALL_GAP); L.push({d:x+STALL_D, f:()=>drawPartition(x)}); }
  G.sinks.forEach(k => L.push({d:k.x+30, f:()=>drawSink(k)}));
  L.push({d:CART.x+CART.y+(CART.w+CART.h)/2, f:drawCart});
  for(const [x,y] of [[-200,-250],[-200,180],[1060,-250],[1060,180],[350,-330],[750,-330]]) L.push({d:x+y+80, f:()=>drawColumn(x,y)});
  for(const [x,y] of [[-330,380],[990,600],[1150,600]]) L.push({d:x+y+40, f:()=>drawStationBench(x,y)});
  L.push({d:980+440+60, f:()=>drawVending(980,440)});
  L.push({d:1e6-1, f:()=>drawBoard(1000,650)});
  L.push({d:1e6, f:drawTrainClipped});
  L.push({d:797, f:drawSignPost});
  L.push({d:700+34, f:()=>drawTrash(700,34)});
  L.push({d:250+530, f:()=>drawWetSign(250,530)});
  L.push({d:868+528, f:()=>drawIndoorPlant(868,528)});

  const gx0 = DOOR.x-40, gx1 = DOOR.x+40;
  L.push({d:gx0+562, f:()=>drawCurb(-16, gx0, 562, 580)});
  for(let x=gx1; x<ROOM.w+16; x+=60){ const x0=x, x1=Math.min(x+60, ROOM.w+16); L.push({d:x1+562, f:()=>drawCurb(x0,x1,562,580)}); }
  for(let y=-16;y<562;y+=60){ const y0=y, y1=Math.min(y+60,562); L.push({d:ROOM.w+y1, f:()=>drawCurb(ROOM.w,ROOM.w+16,y0,y1)}); }

  const enc = v => {
    if(typeof v === "function") return undefined;
    if(v === null || typeof v !== "object") return (typeof v === "number" && !isFinite(v)) ? {$n:String(v)} : v;
    if(ids.has(v)) return {$r:ids.get(v)};
    const id = table.length; ids.set(v, id); table.push(null);
    if(Array.isArray(v)) table[id] = {$a:v.map(x => { const e = enc(x); return e === undefined ? null : e; })};
    else { const o = {}; for(const k in v){ if(v === root && skip && skip.includes(k)) continue; const e = enc(v[k]); if(e !== undefined) o[k] = e; } table[id] = o; }
    return {$r:id};
  };
  enc(root); return table;
}
function unpackGraph(table){
  const objs = table.map(t => t && t.$a ? [] : {});
  const dec = v => (v === null || typeof v !== "object") ? v : v.$r !== undefined ? objs[v.$r] : v.$n !== undefined ? Number(v.$n) : v;
  table.forEach((t, i) => { if(t.$a) t.$a.forEach(x => objs[i].push(dec(x))); else for(const k in t) objs[i][k] = dec(t[k]); });
  return objs[0];
}
function snapshotShift(){ return {day:save.day, t:G.t, revenue:G.revenue, served:G.served, graph:packGraph(G, ["particles","floats","marker"])}; }
function restoreShift(z){
  G = unpackGraph(z.graph); G.particles = []; G.floats = []; G.marker = null;
  for(const c of G.customers) c.T = TYPES[c.type];
}
let autoT = 0;
function autosave(){ if(state!=="play" || !G) return; persist(); try{ localStorage.setItem(SHIFT_KEY, JSON.stringify(snapshotShift())); }catch(e){} }
function clearShift(){ try{ localStorage.removeItem(SHIFT_KEY); }catch(e){} }
function savedShift(){ try{ const z = JSON.parse(localStorage.getItem(SHIFT_KEY)||"null"); return z && z.day===save.day && z.graph && z.t < 400 ? z : null; }catch(e){ return null; } }
function showPaused(){
  pauseForModal();
  openModal(`<h2>${ic("pause")}Mola</h2><p class="sub">Vardiya duraklatıldı, ilerleme kaydedildi.</p><div class="actions"><button type="button" class="cta" id="bResume">Devam et ${ic("play")}</button></div>`);
  $("bResume").onclick = () => { if(modalPrev===0) modalPrev = resumeSpeed || 1; closeModal(); };
}
function setSpeed(s){
  if(!G) return; G.speed = s;
  document.querySelectorAll(".speed button").forEach(b => b.classList.toggle("on", +b.dataset.speed===s));
}
document.querySelectorAll(".speed button").forEach(b => b.onclick = () => { audio(); if(state==="play"){ const s=+b.dataset.speed; setSpeed(s); if(s) resumeSpeed = s; } });
$("dTasks").onclick = () => { const h = !$("side").hidden; $("side").hidden = h; $("dTasks").classList.toggle("on", !h); };
$("dShop").onclick = () => { audio(); if(state==="play") showShop(); };
$("dCodex").onclick = () => { audio(); if(state==="play") showCodex(); };
$("dReport").onclick = () => { audio(); if(state==="play") showReport(); };
$("dSettings").onclick = () => { audio(); if(state==="play") showSettings(); };
$("dSound").onclick = () => { soundOn = !soundOn; if(!soundOn) stopMusic(); audio(); $("sndIcon").innerHTML = `<use href="#i-${soundOn?"vol":"mute"}"/>`; $("sndLbl").textContent = soundOn ? "Ses" : "Sessiz"; };
document.addEventListener("visibilitychange", () => { if(document.hidden) stopMusic(); else if(actx && actx.state==="running" && soundOn && musicOn) startMusic(); if(document.hidden){ autosave(); if(state==="play" && G.speed && !modalOpen()){ modalPrev = G.speed; resumeSpeed = G.speed; setSpeed(0); showPaused(); } } });
addEventListener("pagehide", () => autosave());

function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  const r = $("game").getBoundingClientRect(); VW = r.width; VH = r.height;
  cv.width = Math.floor(VW*DPR); cv.height = Math.floor(VH*DPR);
  fitCamera();
}
let followHold = 0;
const mobileCam = () => VW < 760;
function updateCamera(dt){
  if(!mobileCam() || state!=="play") return;
  if(followHold>0){ followHold -= dt; return; }
  const pl = G.player, p = P(pl.x, pl.y, 20);
  const tx = VW/2 - p[0]*cam.z, ty = VH*.48 - p[1]*cam.z, k = Math.min(1, dt*4);
  cam.x += (tx-cam.x)*k; cam.y += (ty-cam.y)*k;
}
function fitCamera(){
  const narrowV = VW < 760;
  const pts = narrowV ? [P(-20,-20,130), P(930,-20,130), P(-20,600), P(930,600)] : [P(-20,-20,130), P(940,-20,130), P(-20,800), P(940,800)];
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const narrow = VW < 760, padL = narrow ? 12 : 296, padT = narrow ? 96 : 64, padB = narrow ? 90 : 90;
  const z = Math.min((VW-padL-16)/(maxX-minX), (VH-padT-padB)/(maxY-minY));
  cam.z = cam.fit = Math.max(.25, z);
  cam.x = padL + ((VW-padL-16) - (maxX-minX)*cam.z)/2 - minX*cam.z;
  cam.y = padT + ((VH-padT-padB) - (maxY-minY)*cam.z)/2 - minY*cam.z;
  if(narrow && state==="play"){ const sx=VW/2, sy=VH*.48; zoomAt(sx, sy, cam.fit*2.1); const pl=G.player, p=P(pl.x,pl.y,20); cam.x = sx - p[0]*cam.z; cam.y = sy - p[1]*cam.z; }
}
addEventListener("resize", resize);

let last = 0;
const lerp = (a,b,t) => a + (b-a)*t;
// ---------- juice: coin fly to wallet, rings, tension ticks, end-of-day sequence ----------
const J = { coins:[], rings:[], tension:0, tickT:0, pulse:0, stamp:null, flash:0 };
function moneyPill(){ const el = $("hMoney"); return el ? (el.closest(".pill") || el) : null; }
function payFx(sx, sy, amt){
  const el = moneyPill(); if(!el) return;
  const r = el.getBoundingClientRect(), cr = cv.getBoundingClientRect(), tx = r.left - cr.left + 22, ty = r.top - cr.top + r.height/2;
  const n = clamp(Math.round(amt/2)+1, 2, 9);
  for(let i=0;i<n;i++) J.coins.push({x:sx, y:sy, sx, sy, tx, ty, t:-i*.05, dur:rand(.55,.75), bx:rand(-60,60), by:rand(-90,-40), last:i===n-1});
  J.rings.push({x:sx, y:sy, t:0, col:"#f2c230", max:46});
}
function ringFx(sx, sy, col, max=40){ J.rings.push({x:sx, y:sy, t:0, col, max}); }
function badFx(sx, sy){ ringFx(sx, sy, "#d64545", 52); J.flash = Math.max(J.flash, .35); }
function bumpMoney(){ const el = moneyPill(); if(!el) return; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
// call every update with the most urgent patience fraction (0 = about to leave, 1 = relaxed)
function tension(fr, dt){
  const target = fr < .4 ? clamp(1 - fr/.4, 0, 1) : 0;
  J.tension = lerp(J.tension, target, Math.min(1, dt*3));
  if(target > 0){ J.tickT -= dt; if(J.tickT <= 0){ J.tickT = lerp(.9, .32, target); tickSfx(target); J.pulse = 1; } }
  else J.tickT = 0;
}
function tickSfx(k){ tone(1250 + k*500, .045, "square", .022 + k*.02); if(k > .6) tone(620, .06, "triangle", .03, 0, .05); }
function drawJuice(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // tension edge glow
  J.pulse = Math.max(0, J.pulse - dt*2.4);
  const tv = J.tension*(.45 + J.pulse*.55);
  if(tv > .02 && state==="play"){ const g = ctx.createRadialGradient(VW/2, VH/2, Math.min(VW,VH)*.35, VW/2, VH/2, Math.max(VW,VH)*.75);
    g.addColorStop(0, "rgba(214,69,69,0)"); g.addColorStop(1, `rgba(214,69,69,${(tv*.32).toFixed(3)})`); ctx.fillStyle = g; ctx.fillRect(0,0,VW,VH); }
  if(J.flash > 0){ J.flash -= dt; ctx.fillStyle = `rgba(214,69,69,${(Math.max(0,J.flash)*.25).toFixed(3)})`; ctx.fillRect(0,0,VW,VH); }
  // rings
  for(const r of J.rings){ r.t += dt; const k = r.t/.5; ctx.globalAlpha = Math.max(0, 1-k); ctx.strokeStyle = r.col; ctx.lineWidth = 4*(1-k)+1; ctx.beginPath(); ctx.arc(r.x, r.y, 8 + r.max*k, 0, 6.3); ctx.stroke(); }
  J.rings = J.rings.filter(r => r.t < .5); ctx.globalAlpha = 1;
  // coins
  for(const c of J.coins){ c.t += dt; if(c.t < 0) continue; const k = clamp(c.t/c.dur, 0, 1), e = k*k*(3-2*k);
    const x = lerp(c.sx, c.tx, e) + c.bx*Math.sin(k*Math.PI)*.6, y = lerp(c.sy, c.ty, e) + c.by*Math.sin(k*Math.PI);
    const s = 7 - 2*k; ctx.fillStyle = "#f2c230"; ctx.strokeStyle = "#a8741a"; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.ellipse(x, y, s*Math.abs(Math.cos(c.t*9))+1.5, s, 0, 0, 6.3); ctx.fill(); ctx.stroke();
    if(k >= 1 && !c.done){ c.done = true; tone(1500 + rand(0,300), .05, "triangle", .035); if(c.last) bumpMoney(); } }
  J.coins = J.coins.filter(c => !c.done);
  // end-of-day stamp
  const st = J.stamp;
  if(st){ st.t += dt; const k = clamp(st.t/.35, 0, 1), sc = 1 + 1.6*(1-k)*(1-k), fade = st.t > st.dur - .3 ? clamp((st.dur - st.t)/.3, 0, 1) : 1;
    ctx.fillStyle = `rgba(40,30,20,${(.35*clamp(st.t/.4,0,1)).toFixed(3)})`; ctx.fillRect(0,0,VW,VH);
    ctx.save(); ctx.globalAlpha = k*fade; ctx.translate(VW/2, VH*.42); ctx.rotate(-.06); ctx.scale(sc, sc);
    ctx.font = `700 ${Math.min(64, VW/9)|0}px DynaPuff, Nunito, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const w = ctx.measureText(st.txt).width + 60, h = Math.min(64, VW/9)*1.6;
    ctx.fillStyle = "#fff8ec"; rr(-w/2, -h/2, w, h, 18); ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = st.col; ctx.stroke();
    ctx.fillStyle = st.col; ctx.fillText(st.txt, 0, 2);
    ctx.font = "800 15px Nunito, sans-serif"; ctx.fillStyle = "#fff"; ctx.fillText(st.sub, 0, h/2 + 22);
    ctx.restore();
    for(const p of st.conf){ p.vy += 260*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.r += p.vr*dt; ctx.save(); ctx.globalAlpha = fade; ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-4, -2.5, 8, 5); ctx.restore(); }
    if(st.t >= st.dur){ J.stamp = null; st.done(); } }
}
// end-of-day: freeze the scene, stamp + confetti, then open the summary with counting numbers
function endSequence(txt, sub, col, done){
  state = "end"; setSpeed(0); J.tension = 0; J.coins.forEach(c => c.done = true); J.coins = [];
  const cols = ["#e2694f","#f2c230","#4fb08f","#2fa39a","#7b4fa0","#fff8ec"];
  const conf = Array.from({length:70}, () => ({x:VW/2 + rand(-60,60), y:VH*.42, vx:rand(-340,340), vy:rand(-520,-160), r:rand(0,6), vr:rand(-8,8), c:pick(cols)}));
  J.stamp = {txt, sub, col, t:0, dur:1.7, conf, done:() => { done(); countUp(); }};
  tone(523,.14,"square",.05); tone(659,.14,"square",.05,0,.13); tone(784,.14,"square",.05,0,.26); tone(1047,.32,"square",.05,0,.39); noise(.3,.04,3000);
}
function countUp(){
  $("modalCard").querySelectorAll(".stat b").forEach((b, i) => {
    const m = b.textContent.match(/^(₺?)(\d+)([,.]\d+)?$/); if(!m) return;
    const pre = m[1], end = parseFloat(m[2] + (m[3]||"").replace(",", ".")), dec = m[3] ? 1 : 0, t0 = performance.now() + i*120;
    const step = now => { const k = clamp((now - t0)/700, 0, 1), v = end*(1 - Math.pow(1-k, 3));
      b.textContent = pre + (dec ? v.toFixed(1).replace(".", ",") : Math.round(v)); if(k < 1) requestAnimationFrame(step); else b.classList.add("pop"); };
    b.textContent = pre + "0"; requestAnimationFrame(step);
  });
}

function loop(ts){
  const raw = Math.min(.05, (ts-last)/1000 || 0); last = ts;
  if(state==="play" && G.speed>0){ update(raw*G.speed); updateHud(); }
  if(state==="play") updateCamera(raw);
  else if(G.marker){ G.marker.t -= raw; if(G.marker.t<=0) G.marker=null; }
  render(); drawJuice(raw); drawTut();
  requestAnimationFrame(loop);
}

// attract scene behind the welcome card
newDay();
G.stalls[1].dirt=.6; G.stalls[2].clog=true; G.stalls[0].paper=0;
G.puddles.push({x:330,y:330,amt:1,r:32,pts:[1,.9,1.1,.8,1,1.05,.9,1,.95],kind:"water",rot:0});
G.puddles.push({x:600,y:250,amt:.9,r:28,pts:[1,.85,1.1,.9,1,1.1,.9,1,.95],kind:"mud",rot:1});
[["normal",52,205],["acele",70,245],["pis",620,640],["tikayici",-60,646]].forEach(([t,x,y])=>{ G.customers.push({type:t,T:TYPES[t],x,y,state:x<100&&y<300?"queue":"leave",patience:20,maxPat:30,wob:Math.random()*6,slip:0,face:1,path:[]}); });
G.customers[1].bubble = {txt:"ACİL! ACİL!", t:99};
resize(); updateHud(true);
if(VW < 760){ $("side").hidden = true; $("dTasks").classList.remove("on"); }
showWelcome();
requestAnimationFrame(loop);
})();
</script>
