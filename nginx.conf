server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # hashed build assets and covers can be cached for a long time
  location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location /covers/ { expires 7d; }
  # games change often while they're young: always revalidate
  location /games/ { add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }

  location / { try_files $uri $uri/ =404; }
  error_page 404 /404.html;
}
